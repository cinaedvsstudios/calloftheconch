name: Temporary HUD Conus wave validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hud-conus-wave-fixes-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply direct production fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Missing expected text in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          # HUD: hard-key only the opaque black exterior. Retained pixels keep
          # their exact source RGB and alpha; no feathering, tinting or blending.
          path = 'rebuild_v3/app/contexts/gameplay/gameplay_hud.tscn'
          text = read(path)
          start = text.index('[sub_resource type="Shader" id="Shader_hud_black_alpha"]')
          end = text.index('[sub_resource type="SystemFont" id="LocationFont"]')
          keyed = '''[sub_resource type="Shader" id="Shader_hud_black_alpha"]
          code = "shader_type canvas_item;\\nrender_mode unshaded, blend_mix;\\n\\nuniform float black_cutoff : hint_range(0.0, 0.1, 0.001) = 0.012;\\n\\nvoid fragment() {\\n\\tvec4 source = texture(TEXTURE, UV);\\n\\tfloat light = max(source.r, max(source.g, source.b));\\n\\tif (source.a <= 0.0 || light <= black_cutoff) {\\n\\t\\tdiscard;\\n\\t}\\n\\tCOLOR = source;\\n}"

          [sub_resource type="ShaderMaterial" id="ShaderMaterial_hud_black_alpha"]
          shader = SubResource("Shader_hud_black_alpha")
          shader_parameter/black_cutoff = 0.012

          '''
          write(path, text[:start] + keyed + text[end:])

          # Centre the timer visual more within the Item B recess.
          replace_once(
              'rebuild_v3/app/contexts/gameplay/gameplay_hud.gd',
              '''\t_apply_control_rect(
          \t\t_item_status_countdown,
          \t\tRect2(item_b_icon_rect.position + item_b_icon_rect.size * 0.43, item_b_icon_rect.size * 0.57),
          \t)''',
              '''\t_apply_control_rect(
          \t\t_item_status_countdown,
          \t\tRect2(
          \t\t\titem_b_icon_rect.position + item_b_icon_rect.size * Vector2(0.42, 0.43),
          \t\t\titem_b_icon_rect.size * 0.50,
          \t\t),
          \t)''',
          )

          # Countdown art is already cut out. Remove the synthetic shadow layer.
          write('rebuild_v3/app/contexts/gameplay/status_countdown_overlay.tscn', '''[gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://rebuild_v3/app/contexts/gameplay/status_countdown_overlay.gd" id="1_controller"]

          [node name="StatusCountdownOverlay" type="Control"]
          visible = false
          layout_mode = 1
          anchors_preset = 15
          anchor_right = 1.0
          anchor_bottom = 1.0
          grow_horizontal = 2
          grow_vertical = 2
          mouse_filter = 2
          script = ExtResource("1_controller")

          [node name="Hourglass" type="TextureRect" parent="."]
          unique_name_in_owner = true
          layout_mode = 1
          anchors_preset = 15
          anchor_right = 1.0
          anchor_bottom = 1.0
          grow_horizontal = 2
          grow_vertical = 2
          mouse_filter = 2
          expand_mode = 1
          stretch_mode = 5
          ''')
          path = 'rebuild_v3/app/contexts/gameplay/status_countdown_overlay.gd'
          text = read(path)
          text = text.replace('@onready var _shadow: TextureRect = %Shadow\n', '')
          text = text.replace('\t_shadow.show()\n', '')
          text = text.replace('\t\t_shadow.texture = frame_texture\n', '')
          text = text.replace('\t_shadow.hide()\n', '')
          if '_shadow' in text:
              raise SystemExit('Countdown shadow reference remained')
          write(path, text)

          # Argonauta clouds are independent: no compact HUD state and no timer.
          path = 'rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd'
          text = read(path)
          text = text.replace('var _ink_cloud_status: Dictionary = {}\n', '')
          text = text.replace('\t_ink_cloud_status.clear()\n', '')
          impact_start = text.index('func _on_ink_blob_impacted(impact_position: Vector2) -> void:')
          refresh_start = text.index('func _refresh_status_countdown() -> void:')
          impact = '''func _on_ink_blob_impacted(impact_position: Vector2) -> void:
          \tvar cloud: CotcInkParalysisCloud = INK_CLOUD_SCENE.instantiate() as CotcInkParalysisCloud
          \tif cloud == null:
          \t\treturn
          \t_clouds.add_child(cloud)
          \tcloud.play_cloud(impact_position)


          '''
          text = text[:impact_start] + impact + text[refresh_start:]
          refresh_start = text.index('func _refresh_status_countdown() -> void:')
          refresh_end = text.index('func _on_greatfin_pickup_requested', refresh_start)
          refresh = '''func _refresh_status_countdown() -> void:
          \tif not is_instance_valid(_status_countdown):
          \t\treturn
          \tif _mati_active:
          \t\t_set_item_b_timed_active(true)
          \t\t_status_countdown.set_mati_progress(_mati_elapsed)
          \t\treturn
          \tif _purple_shield_remaining > 0.0:
          \t\t_set_item_b_timed_active(true)
          \t\t_status_countdown.set_countdown(
          \t\t\tITEM_MUREX_PECTEN,
          \t\t\t_purple_shield_remaining,
          \t\t\tpurple_shield_seconds,
          \t\t)
          \t\treturn
          \tif _camouflage_remaining > 0.0:
          \t\t_set_item_b_timed_active(true)
          \t\t_status_countdown.set_countdown(
          \t\t\tITEM_HALIOTIS,
          \t\t\t_camouflage_remaining,
          \t\t\tcamouflage_seconds,
          \t\t)
          \t\treturn
          \t_status_countdown.clear_countdown()
          \t_set_item_b_timed_active(false)


          '''
          text = text[:refresh_start] + refresh + text[refresh_end:]

          # Mati also controls the animated waterline shader.
          text = text.replace(
              'var _mati_water_material: ShaderMaterial\nvar _mati_visual_time: float = 0.0',
              'var _mati_water_material: ShaderMaterial\nvar _mati_waterline_material: ShaderMaterial\nvar _mati_visual_time: float = 0.0',
          )
          text = text.replace(
              '\t_mati_water_material = null\n\tif is_instance_valid(_hylas):',
              '\t_mati_water_material = null\n\t_mati_waterline_material = null\n\tif is_instance_valid(_hylas):',
              1,
          )
          capture_anchor = '''\t\tif is_instance_valid(water_mottle) and water_mottle.material is ShaderMaterial:
          \t\t\t_mati_water_material = water_mottle.material as ShaderMaterial
          \t\t\t_mati_water_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)
          \t\t\t_mati_water_material.set_shader_parameter(&"mati_use_manual_time", true)'''
          capture_new = capture_anchor + '''
          \tif is_instance_valid(_connected_level):
          \t\tvar waterlines: CanvasItem = _connected_level.get_node_or_null("ParallaxLayer/waterlines") as CanvasItem
          \t\tif is_instance_valid(waterlines) and waterlines.material is ShaderMaterial:
          \t\t\t_mati_waterline_material = waterlines.material as ShaderMaterial
          \t\t\t_mati_waterline_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)
          \t\t\t_mati_waterline_material.set_shader_parameter(&"mati_use_manual_time", true)'''
          if capture_anchor not in text:
              raise SystemExit('Mati water capture anchor missing')
          text = text.replace(capture_anchor, capture_new, 1)
          apply_anchor = '''\tif is_instance_valid(_mati_water_material):
          \t\t_mati_water_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)'''
          apply_new = apply_anchor + '''
          \tif is_instance_valid(_mati_waterline_material):
          \t\t_mati_waterline_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)'''
          text = text.replace(apply_anchor, apply_new, 1)
          finish_anchor = '''\tif is_instance_valid(_mati_water_material):
          \t\t_mati_water_material.set_shader_parameter(&"mati_use_manual_time", false)
          \t_mati_water_material = null'''
          finish_new = finish_anchor + '''
          \tif is_instance_valid(_mati_waterline_material):
          \t\t_mati_waterline_material.set_shader_parameter(&"mati_use_manual_time", false)
          \t_mati_waterline_material = null'''
          text = text.replace(finish_anchor, finish_new, 1)
          write(path, text)

          # Waterline shader receives controlled time from Mati.
          path = 'assets/backgrounds/waterline2.gdshader'
          text = read(path)
          text = text.replace(
              'uniform float warp_speed : hint_range(0.0, 5.0, 0.01) = 0.35;',
              'uniform float warp_speed : hint_range(0.0, 5.0, 0.01) = 0.35;\nuniform bool mati_use_manual_time = false;\nuniform float mati_manual_time = 0.0;',
          )
          text = text.replace(
              '''void fragment() {
          \t// Animate the tiled texture coordinates
          \tvec2 animated_uv = UV;

          \tanimated_uv += vec2(drift_speed_x, drift_speed_y) * TIME;

          \tanimated_uv.x += sin((UV.y * warp_frequency_x) + TIME * warp_speed) * warp_strength_x;
          \tanimated_uv.y += sin((UV.x * warp_frequency_y) + TIME * warp_speed * 0.8) * warp_strength_y;''',
              '''void fragment() {
          \t// Animate the tiled texture coordinates
          \tfloat animation_time = mati_use_manual_time ? mati_manual_time : TIME;
          \tvec2 animated_uv = UV;

          \tanimated_uv += vec2(drift_speed_x, drift_speed_y) * animation_time;

          \tanimated_uv.x += sin((UV.y * warp_frequency_x) + animation_time * warp_speed) * warp_strength_x;
          \tanimated_uv.y += sin((UV.x * warp_frequency_y) + animation_time * warp_speed * 0.8) * warp_strength_y;''',
          )
          write(path, text)

          # Use an unmistakably saturated green for Charonia.
          replace_once(
              'rebuild_v3/app/contexts/gameplay/item_effect_controller.tscn',
              'super_conch_tint = Color(0.35, 1, 0.72, 1)\nsuper_conch_brightness = 2.2',
              'super_conch_tint = Color(0.02, 1, 0.08, 1)\nsuper_conch_brightness = 2.8',
          )
          replace_once(
              'rebuild_v3/app/contexts/gameplay/item_effect_controller.gd',
              'var _camouflage_remaining: float = 0.0\n',
              'var _camouflage_remaining: float = 0.0\nvar _active_conus_tether: CotcConusTetherProjectile\n',
          )

          # Item controller owns the one live Conus projectile. A second Space
          # retracts a travelling or wall-tethered dart instead of firing another.
          path = 'rebuild_v3/app/contexts/gameplay/item_effect_controller.gd'
          text = read(path)
          conus_start = text.index('func _activate_conus_dart(origin: Vector2, direction: Vector2) -> bool:')
          conus_end = text.index('func _activate_purple_shield() -> bool:', conus_start)
          conus = '''func _activate_conus_dart(origin: Vector2, direction: Vector2) -> bool:
          \tif is_instance_valid(_active_conus_tether):
          \t\t_active_conus_tether.retract()
          \t\t_active_conus_tether = null
          \t\treturn true
          \tif not _hylas.has_method(&"activate_item_a_pose"):
          \t\treturn false
          \tif not bool(_hylas.call(&"activate_item_a_pose", direction)):
          \t\treturn false
          \tvar resolved_direction: Vector2 = direction.normalized() if direction.length_squared() > 0.0001 else Vector2.RIGHT
          \tvar projectile: CotcConusTetherProjectile = CONUS_TETHER_SCENE.instantiate() as CotcConusTetherProjectile
          \tif projectile == null:
          \t\treturn false
          \t_projectiles.add_child(projectile)
          \t_active_conus_tether = projectile
          \tprojectile.tether_finished.connect(
          \t\t_on_conus_tether_finished.bind(projectile),
          \t\tObject.CONNECT_ONE_SHOT,
          \t)
          \tprojectile.launch(origin + resolved_direction * 92.0, resolved_direction, _hylas)
          \treturn true


          func _on_conus_tether_finished(projectile: CotcConusTetherProjectile) -> void:
          \tif _active_conus_tether == projectile:
          \t\t_active_conus_tether = null


          '''
          text = text[:conus_start] + conus + text[conus_end:]
          text = text.replace(
              '\tfor child: Node in _projectiles.get_children():\n\t\tchild.queue_free()',
              '\t_active_conus_tether = null\n\tfor child: Node in _projectiles.get_children():\n\t\tchild.queue_free()',
              1,
          )
          write(path, text)

          # Conus: enemy = stun then return; wall = remain tethered until Space.
          path = 'rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd'
          text = read(path)
          text = text.replace('\t@export_range(0.1, 5.0, 0.05) var anchored_seconds: float = 1.25\n', '')
          text = text.replace(
              'var _anchored_remaining: float = 0.0\nvar _anchored: bool = false',
              'var _wall_tethered: bool = false',
          )
          text = text.replace(
              '\t_anchored_remaining = anchored_seconds\n\t_anchored = false',
              '\t_wall_tethered = false',
          )
          old_physics = '''\tif _anchored:
          \t\t_anchored_remaining = maxf(0.0, _anchored_remaining - delta)
          \t\t_update_visuals()
          \t\tif _anchored_remaining <= 0.0:
          \t\t\ttether_finished.emit()
          \t\t\tqueue_free()
          \t\treturn'''
          new_physics = '''\tif _wall_tethered:
          \t\t_update_visuals()
          \t\treturn'''
          if old_physics not in text:
              raise SystemExit('Old Conus anchored physics block missing')
          text = text.replace(old_physics, new_physics, 1)
          anchor_start = text.index('func _anchor_tether(collider: Object) -> void:')
          anchor_end = text.index('func _get_rope_origin', anchor_start)
          anchor_code = '''func _anchor_tether(collider: Object) -> void:
          \tvar resolved_target: Node = _resolve_dart_target(collider)
          \tif resolved_target != null:
          \t\t_apply_conus_stun(resolved_target)
          \t\tretract()
          \t\treturn
          \tif collider == null:
          \t\tretract()
          \t\treturn
          \t_wall_tethered = true
          \t_update_visuals()


          func retract() -> void:
          \tif is_queued_for_deletion():
          \t\treturn
          \ttether_finished.emit()
          \tqueue_free()


          func is_wall_tethered() -> bool:
          \treturn _wall_tethered


          func _resolve_dart_target(collider: Object) -> Node:
          \tvar current: Node = collider as Node
          \tvar parent_checks: int = 0
          \twhile current != null and parent_checks < 12:
          \t\tif current.has_method(&"receive_conus_dart") or current.has_method(&"receive_conch_hit"):
          \t\t\treturn current
          \t\tcurrent = current.get_parent()
          \t\tparent_checks += 1
          \treturn null


          func _apply_conus_stun(target: Node) -> void:
          \tif target.has_method(&"receive_conus_dart"):
          \t\ttarget.call(&"receive_conus_dart", _source)
          \t\treturn
          \tif target.has_method(&"receive_conch_hit"):
          \t\tvar source_position: Vector2 = _source.global_position if is_instance_valid(_source) else _dart_world_position
          \t\ttarget.call(
          \t\t\t&"receive_conch_hit",
          \t\t\tsource_position,
          \t\t\t_direction,
          \t\t\tsource_position.distance_to(_dart_world_position),
          \t\t\t1.0,
          \t\t)


          '''
          text = text[:anchor_start] + anchor_code + text[anchor_end:]
          write(path, text)

          # Assertions for the exact requested live behaviour.
          checks = {
              'rebuild_v3/app/contexts/gameplay/status_countdown_overlay.tscn': ['[node name="Hourglass"', 'Shadow'],
              'rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd': ['mati_waterline_material', '_ink_cloud_status'],
              'rebuild_v3/app/contexts/gameplay/item_effect_controller.gd': ['_active_conus_tether', '_on_conus_tether_finished'],
              'rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd': ['func retract()', 'func is_wall_tethered()', 'receive_conch_hit'],
              'assets/backgrounds/waterline2.gdshader': ['mati_use_manual_time', 'animation_time'],
          }
          for file_path, terms in checks.items():
              body = read(file_path)
              for term in terms:
                  if term in ('Shadow', '_ink_cloud_status'):
                      if term in body:
                          raise SystemExit(f'Forbidden term remained in {file_path}: {term}')
                  elif term not in body:
                      raise SystemExit(f'Required term missing from {file_path}: {term}')
          PY
      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit-after 120 > /tmp/import.log 2>&1
          godot --headless --path . --quit-after 10 > /tmp/run.log 2>&1
          cat /tmp/import.log
          cat /tmp/run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Invalid cast|Invalid access|Shader error" /tmp/import.log /tmp/run.log; then exit 1; fi
          git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix HUD timer Argonauta Conus and Mati water waves"
          git push origin HEAD:work/hud-conus-wave-fixes-2026-07-16
