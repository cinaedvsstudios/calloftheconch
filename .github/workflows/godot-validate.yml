name: Godot validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit-after 600 2>&1 | tee godot-editor.log

      - name: Run main scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --quit-after 20 2>&1 | tee godot-runtime.log

      - name: Validate required scenes and landscape collisions
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tools/validate_project.gd 2>&1 | tee godot-validation.log

      - name: Reject Godot errors
        shell: bash
        run: |
          if grep -E "ERROR:|Parse Error|Failed to load script|Parent node is busy setting up children|Child is not a child of this node|SCRIPT ERROR|Convex decomposing failed" godot-editor.log godot-runtime.log godot-validation.log; then
            echo "Godot reported an error."
            exit 1
          fi
          grep -q "GODOT_VALIDATION_OK" godot-validation.log
          test ! -e rebuild_v3/game/shared/background_scenery/landscape/alpha_collision_landscape.gd
          test ! -e rebuild_v3/game/shared/background_scenery/landscape/alpha_collision_landscape_base.tscn
          git diff --check

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: |
            godot-editor.log
            godot-runtime.log
            godot-validation.log
          if-no-files-found: ignore
