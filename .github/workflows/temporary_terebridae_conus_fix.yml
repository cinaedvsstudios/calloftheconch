name: Temporary Terebridae and Conus validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'work/terebridae-conus-alignment-fix-2026-07-16'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/terebridae-conus-alignment-fix-2026-07-16
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Apply direct production fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path: str, needle: str, insertion: str, already: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if already in text:
                  return
              index = text.find(needle)
              if index < 0:
                  raise SystemExit(f"Missing insertion anchor in {path}: {needle!r}")
              index += len(needle)
              file_path.write_text(text[:index] + insertion + text[index:])

          def replace_between(path: str, start: str, end: str, replacement: str, already: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if already in text:
                  return
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"Missing start anchor in {path}: {start!r}")
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"Missing end anchor in {path}: {end!r}")
              file_path.write_text(text[:start_index] + replacement + text[end_index:])

          controller = 'rebuild_v3/app/contexts/gameplay/item_effect_controller.gd'
          insert_after(
              controller,
              '\t\t\t"pulse_interval_scale": 0.48,\n',
              '\t\t\t"duration": 5.0,\n',
              '"duration": 5.0',
          )

          hylas = 'scenes/characters/Hylas/hylas_equipment_input.gd'
          insert_after(
              hylas,
              '@export_range(0.0, 180.0, 1.0) var conus_rope_hand_offset: float = 62.0\n',
              '@export_range(-120.0, 120.0, 1.0) var normal_conus_climb_sprite_perpendicular_offset: float = -24.0\n',
              'normal_conus_climb_sprite_perpendicular_offset',
          )
          insert_after(
              hylas,
              'var _conus_climb_previous_facing_left: bool = false\n',
              'var _conus_climb_sprite_base_position: Vector2 = Vector2.ZERO\nvar _conus_climb_normal_sprite_scale: Vector2 = Vector2.ONE\n',
              '_conus_climb_sprite_base_position',
          )
          insert_after(
              hylas,
              '\t_normal_collision_layer = collision_layer\n',
              '\t_conus_climb_sprite_base_position = _animated_sprite.position\n\t_conus_climb_normal_sprite_scale = _animated_sprite.scale\n',
              '\t_conus_climb_sprite_base_position = _animated_sprite.position',
          )
          text = Path(hylas).read_text()
          if '\t_animated_sprite.position = _conus_climb_sprite_base_position\n\t_set_visual_rotation(0.0)' not in text:
              target = '\t_special_velocity = Vector2.ZERO\n\t_set_visual_rotation(0.0)\n'
              if target not in text:
                  raise SystemExit('Missing end-climb restoration anchor')
              Path(hylas).write_text(text.replace(
                  target,
                  '\t_special_velocity = Vector2.ZERO\n\t_animated_sprite.position = _conus_climb_sprite_base_position\n\t_set_visual_rotation(0.0)\n',
                  1,
              ))

          replace_between(
              hylas,
              '\tif _conus_climb_active:\n',
              '\n\t# Exact matching is essential',
              '\tif _conus_climb_active:\n\t\tif event.is_action_pressed(&"conch", false, true) and _is_primary_item_a_binding(event):\n\t\t\t_space_action_pressed_this_frame = false\n\t\t\t_pending_conch_remaining = 0.0\n\t\t\t_pending_interaction_remaining = 0.0\n\t\t\tif is_instance_valid(_conus_climb_tether) and _conus_climb_tether.has_method(&"retract"):\n\t\t\t\t_conus_climb_tether.call(&"retract")\n\t\t\telse:\n\t\t\t\tend_conus_wall_climb()\n\t\t\tget_viewport().set_input_as_handled()\n\t\treturn\n',
              '_conus_climb_tether.call(&"retract")',
          )

          replace_between(
              hylas,
              'func _align_to_conus_rope() -> void:\n',
              '\n\nfunc _update_conus_climb_animation',
              'func _align_to_conus_rope() -> void:\n\tvar rope_vector: Vector2 = _conus_climb_anchor - global_position\n\tif rope_vector.length_squared() <= 0.0001:\n\t\treturn\n\tvar rope_direction: Vector2 = rope_vector.normalized()\n\t_set_visual_rotation(rope_direction.angle() + PI * 0.5)\n\tvar normal_scale_x: float = maxf(absf(_conus_climb_normal_sprite_scale.x), 0.001)\n\tvar greatfin_active: bool = absf(_animated_sprite.scale.x) > normal_scale_x * 1.15\n\tif greatfin_active:\n\t\t_animated_sprite.position = _conus_climb_sprite_base_position\n\telse:\n\t\tvar rope_perpendicular: Vector2 = Vector2(-rope_direction.y, rope_direction.x)\n\t\t_animated_sprite.position = (\n\t\t\t_conus_climb_sprite_base_position\n\t\t\t+ rope_perpendicular * normal_conus_climb_sprite_perpendicular_offset\n\t\t)\n',
              'var normal_scale_x: float =',
          )
          PY

      - name: Verify intended direct changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"duration": 5.0' rebuild_v3/app/contexts/gameplay/item_effect_controller.gd
          grep -q '_conus_climb_tether.call(&"retract")' scenes/characters/Hylas/hylas_equipment_input.gd
          grep -q 'normal_conus_climb_sprite_perpendicular_offset: float = -24.0' scenes/characters/Hylas/hylas_equipment_input.gd
          grep -q 'var greatfin_active: bool = absf(_animated_sprite.scale.x)' scenes/characters/Hylas/hylas_equipment_input.gd

      - name: Godot import validation
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit > /tmp/godot-import.log 2>&1
          code=$?
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(script|resource)' /tmp/godot-import.log; then
            echo '--- Godot import tail ---'
            tail -n 120 /tmp/godot-import.log
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "Godot editor exited with $code"
            tail -n 120 /tmp/godot-import.log
            exit "$code"
          fi

      - name: Upload Godot import diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-diagnostics
          path: /tmp/godot-import.log
          if-no-files-found: error
          retention-days: 1

      - name: Godot runtime smoke test
        shell: bash
        run: |
          set +e
          timeout 20s godot --headless --path . --quit-after 5 > /tmp/godot-runtime.log 2>&1
          code=$?
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(script|resource)' /tmp/godot-runtime.log; then
            echo '--- Godot runtime tail ---'
            tail -n 120 /tmp/godot-runtime.log
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Godot runtime exited with $code"
            tail -n 120 /tmp/godot-runtime.log
            exit "$code"
          fi

      - name: Commit validated production changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/terebridae_conus_fix_trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rebuild_v3/app/contexts/gameplay/item_effect_controller.gd \
                  scenes/characters/Hylas/hylas_equipment_input.gd
          git add -u .github/terebridae_conus_fix_trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Terebridae duration and Conus retraction alignment"
          git push origin HEAD:work/terebridae-conus-alignment-fix-2026-07-16
