name: Structural item fixes validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/structural-item-fixes-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply direct production fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing expected block in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # HUD source image: remove only near-black exterior pixels while keeping
          # source RGB values untouched. No colour tint or shadow layer.
          p = Path('rebuild_v3/app/contexts/gameplay/gameplay_hud.tscn')
          s = p.read_text()
          s = s.replace('[gd_scene format=3 uid="uid://k2serfn5csof"]', '[gd_scene load_steps=7 format=3 uid="uid://k2serfn5csof"]')
          marker = '[sub_resource type="SystemFont" id="LocationFont"]'
          alpha_resources = '''[sub_resource type="Shader" id="Shader_hud_black_alpha"]
          code = "shader_type canvas_item;\\nrender_mode unshaded, blend_mix;\\n\\nuniform float black_cutoff : hint_range(0.0, 0.2, 0.001) = 0.012;\\nuniform float black_feather : hint_range(0.001, 0.2, 0.001) = 0.018;\\n\\nvoid fragment() {\\n\\tvec4 source = texture(TEXTURE, UV) * COLOR;\\n\\tfloat light = max(source.r, max(source.g, source.b));\\n\\tfloat exterior_alpha = smoothstep(black_cutoff, black_cutoff + black_feather, light);\\n\\tCOLOR = vec4(source.rgb, source.a * exterior_alpha);\\n}"

[sub_resource type="ShaderMaterial" id="ShaderMaterial_hud_black_alpha"]
shader = SubResource("Shader_hud_black_alpha")
shader_parameter/black_cutoff = 0.012
shader_parameter/black_feather = 0.018

'''
          if alpha_resources not in s:
              s = s.replace(marker, alpha_resources + marker)
          s = s.replace('mouse_filter = 2\ntexture = ExtResource("2_lc38v")\nexpand_mode = 1\nstretch_mode = 5', 'mouse_filter = 2\nmaterial = SubResource("ShaderMaterial_hud_black_alpha")\ntexture = ExtResource("2_lc38v")\nexpand_mode = 1\nstretch_mode = 5', 1)
          p.write_text(s)

          # Explicit Tyche coordinates target the actual top-left of the Onos recess.
          p = Path('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd')
          s = p.read_text()
          s = s.replace('@export var location_value_rect: Rect2 = Rect2(76.0, 167.0, 361.0, 37.0)', '@export var location_value_rect: Rect2 = Rect2(76.0, 167.0, 361.0, 37.0)\n@export var tyche_icon_rect: Rect2 = Rect2(74.0, 78.0, 28.0, 28.0)\n@export var tyche_value_rect: Rect2 = Rect2(102.0, 78.0, 62.0, 25.0)')
          s = s.replace('_apply_control_rect(_tyche_icon, Rect2(onos_value_rect.position + Vector2(-34.0, -10.0), Vector2(28.0, 28.0)))', '_apply_control_rect(_tyche_icon, tyche_icon_rect)')
          s = s.replace('_apply_control_rect(_tyche_value, Rect2(onos_value_rect.position + Vector2(-5.0, -8.0), Vector2(62.0, 25.0)))', '_apply_control_rect(_tyche_value, tyche_value_rect)')
          p.write_text(s)

          # Countdown lookup must stay inside the packed HUD instance that owns it.
          p = Path('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd')
          s = p.read_text()
          s = s.replace('_status_countdown = context.get_node_or_null("%ItemStatusCountdown") as CotcStatusCountdownOverlay', '_status_countdown = _gameplay_hud.get_node_or_null("ItemStatusCountdown") as CotcStatusCountdownOverlay if is_instance_valid(_gameplay_hud) else null')

          s = s.replace('var _mati_targets: Dictionary = {}\nvar _mati_tick_phase: float = 0.0', '''var _mati_targets: Dictionary = {}
          var _mati_tick_phase: float = 0.0
          var _mati_hylas_process_mode: ProcessMode = Node.PROCESS_MODE_INHERIT
          var _mati_water_material: ShaderMaterial
          var _mati_visual_time: float = 0.0''')

          ready_anchor = 'func configure(context: Node, level: CotcSeaOfPillars, hylas: CotcHylas) -> void:'
          ready_code = '''func _ready() -> void:
          \tsuper._ready()
          \tif not _shield_audio.finished.is_connected(_on_shield_audio_finished):
          \t\t_shield_audio.finished.connect(_on_shield_audio_finished)
          \tif not _invisibility_audio.finished.is_connected(_on_invisibility_audio_finished):
          \t\t_invisibility_audio.finished.connect(_on_invisibility_audio_finished)


          func _on_shield_audio_finished() -> void:
          \tif _purple_shield_remaining > 0.0:
          \t\t_shield_audio.play()


          func _on_invisibility_audio_finished() -> void:
          \tif _camouflage_remaining > 0.0:
          \t\t_invisibility_audio.play()


          '''
          if 'func _on_shield_audio_finished()' not in s:
              s = s.replace(ready_anchor, ready_code + ready_anchor)

          start = s.index('func _capture_mati_targets() -> void:')
          end = s.index('func _set_item_b_timed_active(is_active: bool) -> void:')
          mati_block = '''func _capture_mati_targets() -> void:
          \t_mati_targets.clear()
          \t_mati_tick_phase = 0.0
          \t_mati_visual_time = float(Time.get_ticks_msec()) / 1000.0
          \t_mati_water_material = null
          \tif is_instance_valid(_hylas):
          \t\t_mati_hylas_process_mode = _hylas.process_mode
          \t\t_hylas.process_mode = Node.PROCESS_MODE_ALWAYS
          \tif is_instance_valid(_context):
          \t\tfor child: Node in _context.get_children():
          \t\t\tif child == self or child.name == &"GameplayUI" or child.name == &"ItemEffectController":
          \t\t\t\tcontinue
          \t\t\t_mati_targets[child.get_instance_id()] = {
          \t\t\t\t"node": child,
          \t\t\t\t"process_mode": child.process_mode,
          \t\t\t}
          \t\tvar water_mottle: CanvasItem = _context.get_node_or_null(
          \t\t\t"SeaEnvironment/AtmosphereEffects/WaterMottle"
          \t\t) as CanvasItem
          \t\tif is_instance_valid(water_mottle) and water_mottle.material is ShaderMaterial:
          \t\t\t_mati_water_material = water_mottle.material as ShaderMaterial
          \t\t\t_mati_water_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)
          \t\t\t_mati_water_material.set_shader_parameter(&"mati_use_manual_time", true)


          func _apply_mati_world_activity(activity: float, delta: float) -> void:
          \t_mati_tick_phase = fmod(_mati_tick_phase + maxf(delta, 0.0) * 12.0, 1.0)
          \t_mati_visual_time += maxf(delta, 0.0) * activity
          \tif is_instance_valid(_mati_water_material):
          \t\t_mati_water_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)
          \tvar allow_tick: bool = activity >= 0.999 or _mati_tick_phase < activity
          \tfor entry_value: Variant in _mati_targets.values():
          \t\tif not (entry_value is Dictionary):
          \t\t\tcontinue
          \t\tvar entry: Dictionary = entry_value
          \t\tvar node: Node = entry.get("node") as Node
          \t\tif not is_instance_valid(node):
          \t\t\tcontinue
          \t\tvar original_mode: int = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT))
          \t\tnode.process_mode = original_mode if allow_tick else Node.PROCESS_MODE_DISABLED


          func _finish_mati() -> void:
          \tfor entry_value: Variant in _mati_targets.values():
          \t\tif not (entry_value is Dictionary):
          \t\t\tcontinue
          \t\tvar entry: Dictionary = entry_value
          \t\tvar node: Node = entry.get("node") as Node
          \t\tif is_instance_valid(node):
          \t\t\tnode.process_mode = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT))
          \t_mati_targets.clear()
          \tif is_instance_valid(_hylas):
          \t\t_hylas.process_mode = _mati_hylas_process_mode
          \tif is_instance_valid(_mati_water_material):
          \t\t_mati_water_material.set_shader_parameter(&"mati_use_manual_time", false)
          \t_mati_water_material = null
          \t_mati_active = false
          \t_mati_elapsed = 0.0
          \t_set_item_b_timed_active(false)
          \tif is_instance_valid(_status_countdown):
          \t\t_status_countdown.clear_countdown()


          '''
          s = s[:start] + mati_block + s[end:]

          # Stop timed sounds exactly when their gameplay state stops.
          stop_anchor = 'func _on_ink_blob_impacted(impact_position: Vector2) -> void:'
          stop_code = '''func _stop_purple_shield() -> void:
          \t_shield_audio.stop()
          \tsuper._stop_purple_shield()


          func _stop_camouflage() -> void:
          \t_invisibility_audio.stop()
          \tsuper._stop_camouflage()


          '''
          if 'func _stop_purple_shield() -> void:' not in s:
              s = s.replace(stop_anchor, stop_code + stop_anchor)
          s = s.replace('func clear_active_effects() -> void:\n\t_ink_cloud_status.clear()', 'func clear_active_effects() -> void:\n\t_shield_audio.stop()\n\t_invisibility_audio.stop()\n\t_ink_cloud_status.clear()')
          p.write_text(s)

          # Use shader tint as the single colour source; sprite RGB stays white.
          replace(
              'rebuild_v3/features/effects/conch_pulse_item_profiles.gd',
              'pulse_sprite.modulate = Color(_active_pulse_tint.r, _active_pulse_tint.g, _active_pulse_tint.b, 0.0)',
              'pulse_sprite.modulate = Color(1.0, 1.0, 1.0, 0.0)',
          )
          replace(
              'rebuild_v3/features/effects/conch_pulse_arc.gdshader',
              'vec4 source = texture(TEXTURE, UV) * COLOR;',
              'vec4 source = texture(TEXTURE, UV);',
          )
          replace(
              'rebuild_v3/features/effects/conch_pulse_arc.gdshader',
              'COLOR = vec4(tint_color.rgb * light * brightness, final_mask * tint_color.a);',
              'COLOR = vec4(tint_color.rgb * light * brightness, final_mask * tint_color.a * COLOR.a);',
          )

          # Water mottle uses controllable time during Mati instead of built-in TIME.
          p = Path('rebuild_v3/features/sea_of_pillars/water_noise.gdshader')
          s = p.read_text()
          s = s.replace('uniform float depth_strength : hint_range(0.0, 1.0, 0.001) = 0.16;', 'uniform float depth_strength : hint_range(0.0, 1.0, 0.001) = 0.16;\nuniform bool mati_use_manual_time = false;\nuniform float mati_manual_time = 0.0;')
          s = s.replace('void fragment() {\n\tvec2 cloud_uv_a = UV * tile_count + flow_a * TIME;\n\tvec2 cloud_uv_b = UV * tile_count * 0.73 + vec2(0.317, 0.683) + flow_b * TIME;', 'void fragment() {\n\tfloat animation_time = mati_use_manual_time ? mati_manual_time : TIME;\n\tvec2 cloud_uv_a = UV * tile_count + flow_a * animation_time;\n\tvec2 cloud_uv_b = UV * tile_count * 0.73 + vec2(0.317, 0.683) + flow_b * animation_time;')
          s = s.replace('sin(TIME * evolution_speed)', 'sin(animation_time * evolution_speed)')
          p.write_text(s)

          # Preserve the current Conus appearance and add only a wider soft bloom.
          p = Path('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn')
          s = p.read_text()
          s = s.replace('[node name="RopeGlow" type="Line2D" parent="."]', '''[node name="RopeBloom" type="Line2D" parent="."]
          material = SubResource("GlowMaterial")
          width = 14.0
          default_color = Color(1, 0.18, 0.01, 0.08)
          texture = ExtResource("2_rope")
          texture_mode = 2
          texture_repeat = 2
          joint_mode = 2
          begin_cap_mode = 2
          end_cap_mode = 2
          antialiased = true

          [node name="RopeGlow" type="Line2D" parent="."]''')
          p.write_text(s)

          # Existing projectile controller updates every Line2D child uniformly.
          # Verify that remains true rather than adding a helper path.
          rope_controller = Path('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd').read_text()
          if 'for line' not in rope_controller and 'get_children()' not in rope_controller:
              raise SystemExit('Conus controller does not update Line2D children generically; inspect before commit')
          PY
      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit-after 120 > /tmp/import.log 2>&1
          godot --headless --path . --quit-after 10 > /tmp/run.log 2>&1
          cat /tmp/import.log
          cat /tmp/run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Invalid cast|Invalid access" /tmp/import.log /tmp/run.log; then
            exit 1
          fi
          git diff --check
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-structural-item-fixes.yml
          git add -A
          git diff --cached --check
          git commit -m "Fix live HUD timers, pulse colour, audio loops and Mati world freeze"
          git push origin HEAD:work/structural-item-fixes-2026-07-16
