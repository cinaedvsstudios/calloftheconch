name: Temporary Conus climb validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'work/conus-climb-2026-07-16'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/conus-climb-2026-07-16
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Apply direct climb implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing expected block in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          normal_frames = 'scenes/characters/Hylas/hylas_v3_sprite_frames.tres'
          replace_once(
              normal_frames,
              '[ext_resource type="Texture2D" uid="uid://bdfl7epsph2wo" path="res://assets/characters/hylas-crawl_04.webp" id="46_crawl_04"]\n',
              '[ext_resource type="Texture2D" uid="uid://bdfl7epsph2wo" path="res://assets/characters/hylas-crawl_04.webp" id="46_crawl_04"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-climb01.webp" id="47_climb_01"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-climb02.webp" id="48_climb_02"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-climb03.webp" id="49_climb_03"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-climb04.webp" id="50_climb_04"]\n',
          )
          replace_once(
              normal_frames,
              '}, {\n"frames": [{\n"duration": 1.0,\n"texture": ExtResource("43_crawl_01")',
              '}, {\n"frames": [{\n"duration": 1.0,\n"texture": ExtResource("47_climb_01")\n}, {\n"duration": 1.0,\n"texture": ExtResource("48_climb_02")\n}, {\n"duration": 1.0,\n"texture": ExtResource("49_climb_03")\n}, {\n"duration": 1.0,\n"texture": ExtResource("50_climb_04")\n}],\n"loop": 1,\n"name": &"climb",\n"speed": 7.0\n}, {\n"frames": [{\n"duration": 1.0,\n"texture": ExtResource("43_crawl_01")',
          )

          greatfin_frames = 'scenes/characters/Hylas/hylas_greatfin_sprite_frames.tres'
          replace_once(
              greatfin_frames,
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-jump_04.webp" id="41_jump04"]\n',
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-jump_04.webp" id="41_jump04"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-greatfin-climb01.webp" id="42_climb01"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-greatfin-climb02.webp" id="43_climb02"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-greatfin-climb03.webp" id="44_climb03"]\n'
              '[ext_resource type="Texture2D" path="res://assets/characters/hylas-greatfin-climb04.webp" id="45_climb04"]\n',
          )
          crawl_animation = '{"frames":[{"duration":1.0,"texture":ExtResource("13_crawl01")},{"duration":1.0,"texture":ExtResource("14_crawl02")},{"duration":1.0,"texture":ExtResource("15_crawl03")},{"duration":1.0,"texture":ExtResource("16_crawl04")}],"loop":1,"name":&"crawl","speed":8.0}'
          climb_animation = '{"frames":[{"duration":1.0,"texture":ExtResource("42_climb01")},{"duration":1.0,"texture":ExtResource("43_climb02")},{"duration":1.0,"texture":ExtResource("44_climb03")},{"duration":1.0,"texture":ExtResource("45_climb04")}],"loop":1,"name":&"climb","speed":7.0}'
          replace_once(greatfin_frames, crawl_animation, climb_animation + ',' + crawl_animation)

          projectile = 'rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd'
          replace_once(
              projectile,
              '\t_wall_tethered = true\n\t_update_visuals()\n',
              '\t_wall_tethered = true\n\tif is_instance_valid(_source) and _source.has_method(&"begin_conus_wall_climb"):\n\t\t_source.call(&"begin_conus_wall_climb", _dart_world_position, self)\n\t_update_visuals()\n',
          )
          replace_once(
              projectile,
              'func retract() -> void:\n\tif is_queued_for_deletion():\n\t\treturn\n\ttether_finished.emit()\n\tqueue_free()\n',
              'func retract() -> void:\n\tif is_queued_for_deletion():\n\t\treturn\n\tif _wall_tethered and is_instance_valid(_source) and _source.has_method(&"end_conus_wall_climb"):\n\t\t_source.call(&"end_conus_wall_climb", self)\n\t_wall_tethered = false\n\ttether_finished.emit()\n\tqueue_free()\n',
          )
          replace_once(
              projectile,
              'func is_wall_tethered() -> bool:\n\treturn _wall_tethered\n',
              'func is_wall_tethered() -> bool:\n\treturn _wall_tethered\n\n\nfunc get_anchor_position() -> Vector2:\n\treturn _dart_world_position\n',
          )
          replace_once(
              projectile,
              'func _get_rope_origin(fallback: Vector2) -> Vector2:\n\tif not is_instance_valid(_source):\n\t\treturn fallback\n\tvar marker: Node2D = _source.get_node_or_null("ConchPulseOrigin") as Node2D\n',
              'func _get_rope_origin(fallback: Vector2) -> Vector2:\n\tif not is_instance_valid(_source):\n\t\treturn fallback\n\tif _source.has_method(&"get_conus_rope_origin"):\n\t\tvar resolved_origin: Variant = _source.call(&"get_conus_rope_origin")\n\t\tif resolved_origin is Vector2:\n\t\t\treturn resolved_origin\n\tvar marker: Node2D = _source.get_node_or_null("ConchPulseOrigin") as Node2D\n',
          )
          replace_once(
              projectile,
              '\tvar local_start: Vector2 = to_local(source_position)\n\tvar local_end: Vector2 = to_local(_dart_world_position)\n\tvar perpendicular: Vector2 = Vector2(-_direction.y, _direction.x)\n',
              '\tvar local_start: Vector2 = to_local(source_position)\n\tvar local_end: Vector2 = to_local(_dart_world_position)\n\tvar rope_direction: Vector2 = _dart_world_position - source_position\n\tif rope_direction.length_squared() <= 0.0001:\n\t\trope_direction = _direction\n\telse:\n\t\trope_direction = rope_direction.normalized()\n\tvar perpendicular: Vector2 = Vector2(-rope_direction.y, rope_direction.x)\n',
          )

          hylas = 'scenes/characters/Hylas/hylas_equipment_input.gd'
          replace_once(
              hylas,
              'const NORMAL_CONCH_ID: StringName = &"normal_conch"\nconst TRIDACNA_SURFACE_LAUNCH_VELOCITY_SCALE: float = 1.41421356237\n',
              'const NORMAL_CONCH_ID: StringName = &"normal_conch"\nconst CONUS_TEXTILE_ID: StringName = &"conus_textile"\nconst CONUS_CLIMB_ANIMATION: StringName = &"climb"\nconst TRIDACNA_SURFACE_LAUNCH_VELOCITY_SCALE: float = 1.41421356237\n',
          )
          replace_once(
              hylas,
              '@onready var _item_visuals: CotcHylasItemVisuals = %ItemVisuals\n\nvar _equipped_item_a: StringName = NORMAL_CONCH_ID\n',
              '@export_category("Conus Wall Climb")\n@export_range(40.0, 900.0, 5.0) var conus_climb_speed: float = 260.0\n@export_range(40.0, 240.0, 1.0) var conus_climb_minimum_distance: float = 100.0\n@export_range(0.01, 0.90, 0.01) var conus_climb_input_deadzone: float = 0.16\n@export_range(0.0, 180.0, 1.0) var conus_rope_hand_offset: float = 62.0\n\n@onready var _item_visuals: CotcHylasItemVisuals = %ItemVisuals\n\nvar _equipped_item_a: StringName = NORMAL_CONCH_ID\n',
          )
          replace_once(
              hylas,
              'var _camouflage_active: bool = false\nvar _normal_collision_layer: int = 1\n',
              'var _camouflage_active: bool = false\nvar _normal_collision_layer: int = 1\nvar _conus_climb_active: bool = false\nvar _conus_climb_anchor: Vector2 = Vector2.ZERO\nvar _conus_climb_maximum_distance: float = 0.0\nvar _conus_climb_tether: Node\nvar _conus_climb_previous_facing_left: bool = false\n',
          )
          replace_once(
              hylas,
              'func set_purple_shield_active(is_active: bool) -> void:\n',
              '''func begin_conus_wall_climb(anchor_position: Vector2, tether: Node) -> void:
\tif _death_sequence_active or not _play_enabled or not is_instance_valid(tether):
\t\treturn
\t_conus_climb_active = true
\t_conus_climb_anchor = anchor_position
\t_conus_climb_tether = tether
\t_conus_climb_maximum_distance = maxf(
\t\tconus_climb_minimum_distance,
\t\tglobal_position.distance_to(anchor_position),
\t)
\t_conus_climb_previous_facing_left = _facing_left
\t_facing_left = false
\t_brake_active = false
\t_burst_active = false
\t_burst_remaining = 0.0
\t_tail_flip_remaining = 0.0
\t_conch_remaining = 0.0
\t_pending_conch_remaining = 0.0
\t_pending_surface_jump = false
\t_jump_elapsed = 0.0
\t_swim_velocity = Vector2.ZERO
\t_burst_coast_velocity = Vector2.ZERO
\t_special_velocity = Vector2.ZERO
\tvelocity = Vector2.ZERO
\t_stop_movement_audio()
\t_animated_sprite.speed_scale = 1.0
\t_set_animation(CONUS_CLIMB_ANIMATION)
\t_animated_sprite.frame = 0
\t_animated_sprite.pause()
\t_align_to_conus_rope()


func end_conus_wall_climb(tether: Node = null) -> void:
\tif not _conus_climb_active:
\t\treturn
\tif tether != null and is_instance_valid(_conus_climb_tether) and tether != _conus_climb_tether:
\t\treturn
\t_conus_climb_active = false
\t_conus_climb_tether = null
\t_conus_climb_maximum_distance = 0.0
\t_facing_left = _conus_climb_previous_facing_left
\t_animated_sprite.speed_scale = 1.0
\tvelocity = Vector2.ZERO
\t_swim_velocity = Vector2.ZERO
\t_burst_coast_velocity = Vector2.ZERO
\t_special_velocity = Vector2.ZERO
\t_set_visual_rotation(0.0)
\tif _play_enabled and not _death_sequence_active:
\t\t_set_animation(&"idle")


func is_conus_wall_climbing() -> bool:
\treturn _conus_climb_active


func get_conus_rope_origin() -> Vector2:
\tif _conus_climb_active:
\t\tvar rope_vector: Vector2 = _conus_climb_anchor - global_position
\t\tif rope_vector.length_squared() > 0.0001:
\t\t\treturn global_position + rope_vector.normalized() * conus_rope_hand_offset
\tvar marker: Node2D = get_node_or_null("ConchPulseOrigin") as Node2D
\treturn marker.global_position if marker != null else global_position


func set_purple_shield_active(is_active: bool) -> void:
''',
          )
          replace_once(
              hylas,
              'func clear_item_effect_state() -> void:\n\t_item_surge_remaining = 0.0\n',
              'func clear_item_effect_state() -> void:\n\tend_conus_wall_climb()\n\t_item_surge_remaining = 0.0\n',
          )
          replace_once(
              hylas,
              '\tvar key_event: InputEventKey = event as InputEventKey\n\tif key_event != null and key_event.echo:\n\t\treturn\n\n\t# Exact matching is essential',
              '\tvar key_event: InputEventKey = event as InputEventKey\n\tif key_event != null and key_event.echo:\n\t\treturn\n\n\tif _conus_climb_active:\n\t\tif event.is_action_pressed(&"conch", false, true) and _is_primary_item_a_binding(event):\n\t\t\titem_a_requested.emit(CONUS_TEXTILE_ID, global_position, Vector2.ZERO)\n\t\t\tget_viewport().set_input_as_handled()\n\t\treturn\n\n\t# Exact matching is essential',
          )
          replace_once(
              hylas,
              'func _physics_process(delta: float) -> void:\n\t_item_surge_remaining = maxf(0.0, _item_surge_remaining - delta)\n\tsuper._physics_process(delta)\n\t_utility_item_pressed_this_frame = false\n',
              'func _physics_process(delta: float) -> void:\n\t_item_surge_remaining = maxf(0.0, _item_surge_remaining - delta)\n\tif _conus_climb_active:\n\t\t_update_conus_wall_climb(delta)\n\t\t_utility_item_pressed_this_frame = false\n\t\treturn\n\tsuper._physics_process(delta)\n\t_utility_item_pressed_this_frame = false\n',
          )
          replace_once(
              hylas,
              '\t\tor airborne_active\n\t\tor _burst_active\n',
              '\t\tor airborne_active\n\t\tor _conus_climb_active\n\t\tor _burst_active\n',
          )
          replace_once(
              hylas,
              'func _resolve_item_direction(direction: Vector2) -> Vector2:\n',
              '''func _update_conus_wall_climb(delta: float) -> void:
\tif (
\t\t\tnot is_instance_valid(_conus_climb_tether)
\t\t\tor not _conus_climb_tether.has_method(&"is_wall_tethered")
\t\t\tor not bool(_conus_climb_tether.call(&"is_wall_tethered"))
\t\t):
\t\tend_conus_wall_climb()
\t\treturn
\tif _conus_climb_tether.has_method(&"get_anchor_position"):
\t\tvar anchor_value: Variant = _conus_climb_tether.call(&"get_anchor_position")
\t\tif anchor_value is Vector2:
\t\t\t_conus_climb_anchor = anchor_value

\t_current_time += delta
\t_update_cooldowns(delta)
\t_update_camera_shake(delta)
\t_update_shadow()

\tvar rope_vector: Vector2 = _conus_climb_anchor - global_position
\tif rope_vector.length_squared() <= 0.0001:
\t\tend_conus_wall_climb(_conus_climb_tether)
\t\treturn
\tvar rope_direction: Vector2 = rope_vector.normalized()
\tvar rope_distance: float = rope_vector.length()
\tvar input_direction: Vector2 = Input.get_vector(
\t\t&"move_left",
\t\t&"move_right",
\t\t&"move_up",
\t\t&"move_down",
\t)
\tvar climb_axis: float = input_direction.dot(rope_direction)
\tif absf(climb_axis) < conus_climb_input_deadzone:
\t\tclimb_axis = 0.0
\tif climb_axis > 0.0 and rope_distance <= conus_climb_minimum_distance:
\t\tclimb_axis = 0.0
\telif climb_axis < 0.0 and rope_distance >= _conus_climb_maximum_distance:
\t\tclimb_axis = 0.0

\tvelocity = rope_direction * climb_axis * conus_climb_speed
\tif climb_axis != 0.0:
\t\tmove_and_slide()
\t\tglobal_position = _clamp_to_world(global_position)

\tvar corrected_vector: Vector2 = _conus_climb_anchor - global_position
\tvar corrected_distance: float = corrected_vector.length()
\tif corrected_distance > 0.0001:
\t\tvar corrected_direction: Vector2 = corrected_vector / corrected_distance
\t\tif corrected_distance > _conus_climb_maximum_distance:
\t\t\tglobal_position = _conus_climb_anchor - corrected_direction * _conus_climb_maximum_distance
\t\telif corrected_distance < conus_climb_minimum_distance:
\t\t\tglobal_position = _conus_climb_anchor - corrected_direction * conus_climb_minimum_distance

\t_swim_velocity = Vector2.ZERO
\t_burst_coast_velocity = Vector2.ZERO
\t_special_velocity = Vector2.ZERO
\t_align_to_conus_rope()
\t_update_conus_climb_animation(climb_axis)


func _align_to_conus_rope() -> void:
\tvar rope_vector: Vector2 = _conus_climb_anchor - global_position
\tif rope_vector.length_squared() <= 0.0001:
\t\treturn
\t_set_visual_rotation(rope_vector.angle() + PI * 0.5)


func _update_conus_climb_animation(climb_axis: float) -> void:
\tif _animated_sprite.animation != CONUS_CLIMB_ANIMATION:
\t\t_set_animation(CONUS_CLIMB_ANIMATION)
\tif climb_axis == 0.0:
\t\t_animated_sprite.speed_scale = 1.0
\t\t_animated_sprite.frame = 0
\t\t_animated_sprite.pause()
\t\treturn
\tvar desired_speed: float = 1.0 if climb_axis > 0.0 else -1.0
\tif not _animated_sprite.is_playing() or not is_equal_approx(_animated_sprite.speed_scale, desired_speed):
\t\t_animated_sprite.speed_scale = desired_speed
\t\tif desired_speed < 0.0 and _animated_sprite.frame == 0:
\t\t\t_animated_sprite.frame = _animated_sprite.sprite_frames.get_frame_count(CONUS_CLIMB_ANIMATION) - 1
\t\t_animated_sprite.play(CONUS_CLIMB_ANIMATION)


func _resolve_item_direction(direction: Vector2) -> Vector2:
''',
          )
          replace_once(
              hylas,
              '\tlines.append("camouflage_active=%s" % str(_camouflage_active))\n',
              '\tlines.append("camouflage_active=%s" % str(_camouflage_active))\n\tlines.append("conus_climb_active=%s" % str(_conus_climb_active))\n\tlines.append("conus_climb_anchor=%s" % str(_conus_climb_anchor))\n',
          )
          PY

      - name: Verify direct implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/characters/hylas-climb01.webp
          test -f assets/characters/hylas-climb02.webp
          test -f assets/characters/hylas-climb03.webp
          test -f assets/characters/hylas-climb04.webp
          test -f assets/characters/hylas-greatfin-climb01.webp
          test -f assets/characters/hylas-greatfin-climb02.webp
          test -f assets/characters/hylas-greatfin-climb03.webp
          test -f assets/characters/hylas-greatfin-climb04.webp
          grep -q 'name": &"climb"' scenes/characters/Hylas/hylas_v3_sprite_frames.tres
          grep -q 'name":&"climb"' scenes/characters/Hylas/hylas_greatfin_sprite_frames.tres
          grep -q 'begin_conus_wall_climb' rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd
          grep -q 'func _update_conus_wall_climb' scenes/characters/Hylas/hylas_equipment_input.gd

      - name: Godot import validation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(script|resource)' /tmp/godot-import.log

      - name: Godot runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-runtime.log || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(script|resource)' /tmp/godot-runtime.log

      - name: Commit validated production changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/conus_climb_trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scenes/characters/Hylas/hylas_v3_sprite_frames.tres \
                  scenes/characters/Hylas/hylas_greatfin_sprite_frames.tres \
                  scenes/characters/Hylas/hylas_equipment_input.gd \
                  rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd
          git add -u .github/conus_climb_trigger.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Conus wall tether climbing"
          git push origin HEAD:work/conus-climb-2026-07-16
