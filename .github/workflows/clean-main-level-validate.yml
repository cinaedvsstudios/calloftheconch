name: Clean main level validation

on:
  push:
    branches:
      - work/clean-main-level-2026-07-15
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit-after 600 2>&1 | tee godot-editor.log

      - name: Run main scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 20 2>&1 | tee godot-runtime.log

      - name: Validate clean and prototype levels
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tools/validate_clean_main_level.gd 2>&1 | tee godot-clean-level.log

      - name: Reject relevant Godot errors
        shell: bash
        run: |
          if grep -E "Parse Error|Failed to load script|SCRIPT ERROR|Invalid call|Invalid set index|Cannot assign|Could not load scene|Could not instantiate|Node not found|is not a valid child" godot-editor.log godot-runtime.log godot-clean-level.log; then
            echo "Godot reported a relevant project error."
            exit 1
          fi
          grep -q "CLEAN_MAIN_LEVEL_VALIDATION_OK" godot-clean-level.log
          git diff --check

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-main-level-validation-logs
          path: |
            godot-editor.log
            godot-runtime.log
            godot-clean-level.log
          if-no-files-found: ignore
