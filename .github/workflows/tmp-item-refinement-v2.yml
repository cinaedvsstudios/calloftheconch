name: Temporary item refinement v2
on:
  push:
    branches: [work/item-visual-timing-pass-2026-07-16]
permissions:
  contents: write
jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[item-refinement-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/item-visual-timing-pass-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new, count=-1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,count))

          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.tscn','process_mode = 1','process_mode = 3',1)
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.tscn','purple_shield_seconds = 10.0','purple_shield_seconds = 30.0')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.tscn','camouflage_seconds = 10.0','camouflage_seconds = 30.0')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.tscn','sonic_drill_tint = Color(0.22, 1, 0.48, 1)','sonic_drill_tint = Color(1, 0.08, 0.88, 1)')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.gd','var purple_shield_seconds: float = 6.0','var purple_shield_seconds: float = 30.0')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.gd','var camouflage_seconds: float = 7.0','var camouflage_seconds: float = 30.0')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.gd','@export var super_conch_tint: Color = Color(0.40, 0.95, 1.0, 1.0)','@export var super_conch_tint: Color = Color(0.20, 1.0, 0.48, 1.0)')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.gd','@export var sonic_drill_tint: Color = Color(0.96, 0.30, 1.0, 1.0)','@export var sonic_drill_tint: Color = Color(1.0, 0.08, 0.88, 1.0)')
          rep('rebuild_v3/app/contexts/gameplay/item_effect_controller.gd','"echo_alpha_decay": 0.06,','"echo_alpha_decay": 0.06,\n\t\t\t"pulse_interval_scale": 0.48,')
          rep('rebuild_v3/features/effects/conch_pulse_item_profiles.gd','var _default_echo_alpha_decay: float','var _default_echo_alpha_decay: float\nvar _default_pulse_interval: float')
          rep('rebuild_v3/features/effects/conch_pulse_item_profiles.gd','_default_echo_alpha_decay = echo_alpha_decay','_default_echo_alpha_decay = echo_alpha_decay\n\t_default_pulse_interval = pulse_interval')
          rep('rebuild_v3/features/effects/conch_pulse_item_profiles.gd','echo_alpha_decay = float(profile.get("echo_alpha_decay", _default_echo_alpha_decay))','echo_alpha_decay = float(profile.get("echo_alpha_decay", _default_echo_alpha_decay))\n\tpulse_interval = _default_pulse_interval * float(profile.get("pulse_interval_scale", 1.0))')
          rep('scenes/characters/Hylas/hylas_item_visuals.gd','const GREATFIN_VISUAL_SCALE: float = 1.30','const GREATFIN_VISUAL_SCALE: float = 1.30\nconst HELD_SHELL_VISUAL_SCALE: float = 0.62')
          rep('scenes/characters/Hylas/hylas_item_visuals.gd','_shell_overlay.scale = _animated_sprite.scale','_shell_overlay.scale = _animated_sprite.scale * HELD_SHELL_VISUAL_SCALE')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','[gd_scene load_steps=6 format=3]','[gd_scene load_steps=8 format=3]')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','[ext_resource type="Shader" path="res://rebuild_v3/shared/shaders/conus_dart_outline.gdshader" id="4_dart_shader"]','[ext_resource type="Shader" path="res://rebuild_v3/shared/shaders/conus_dart_outline.gdshader" id="4_dart_shader"]\n[ext_resource type="Shader" path="res://rebuild_v3/shared/shaders/conus_rope_scroll.gdshader" id="5_rope_shader"]')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','[sub_resource type="ShaderMaterial" id="DartMaterial"]','[sub_resource type="ShaderMaterial" id="RopeMaterial"]\nresource_local_to_scene = true\nshader = ExtResource("5_rope_shader")\nshader_parameter/scroll_speed = 0.85\nshader_parameter/glow_color = Color(1, 0.25, 0.03, 1)\n\n[sub_resource type="ShaderMaterial" id="DartMaterial"]')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','dart_display_height = 34.0','dart_display_height = 17.0')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','default_color = Color(0.12, 1, 0.58, 0.58)','default_color = Color(1, 0.28, 0.04, 0.62)')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','[node name="Rope" type="Line2D" parent="."]\nunique_name_in_owner = true','[node name="Rope" type="Line2D" parent="."]\nunique_name_in_owner = true\nmaterial = SubResource("RopeMaterial")')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn','default_color = Color(0.82, 1, 0.9, 1)','default_color = Color(1, 0.72, 0.28, 1)')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd','var dart_display_height: float = 34.0','var dart_display_height: float = 17.0')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd','var rope_wave_speed: float = 1.8','var rope_wave_speed: float = 2.6')
          rep('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd','rope_glow_color.a = lerpf(0.48, 0.72, pulse)','rope_glow_color = Color(1.0, 0.24, 0.03, lerpf(0.48, 0.78, pulse))')
          rep('rebuild_v3/game/shared/items/argonauta/ink_paralysis_cloud.gd','@export_range(0.1, 20.0, 0.1) var active_seconds: float = 10.0','@export_range(0.1, 60.0, 0.1) var active_seconds: float = 30.0')
          rep('rebuild_v3/game/shared/items/argonauta/ink_paralysis_cloud.gd','modulate.a = lerpf(minimum_opacity, maximum_opacity, breathing)','modulate.a = clampf(lerpf(minimum_opacity, maximum_opacity, breathing), 0.40, 0.80)')
          rep('rebuild_v3/game/shared/items/argonauta/ink_paralysis_cloud.tscn','active_seconds = 10.0','active_seconds = 30.0')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.tscn','[node name="ItemStatusCountdown" parent="ItemBIcon" instance=ExtResource("4_countdown")]','[node name="ItemStatusCountdown" parent="." instance=ExtResource("4_countdown")]')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','@onready var _item_b_empty: Label = %ItemBEmpty','@onready var _item_b_empty: Label = %ItemBEmpty\n@onready var _item_status_countdown: Control = %ItemStatusCountdown\n\nvar _tyche_icon: TextureRect\nvar _tyche_value: Label')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','_create_panel_shadow()\n\t_set_slot_rest_state','_create_panel_shadow()\n\t_create_tyche_display()\n\t_set_slot_rest_state')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','_game_state.inventory_changed.connect(_on_inventory_changed)','_game_state.inventory_changed.connect(_on_inventory_changed)\n\t\t_game_state.tyche_changed.connect(_on_tyche_changed)')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','_apply_control_rect(_item_b_glow, item_b_icon_rect)\n\t_apply_control_rect(_item_b_icon, item_b_icon_rect)','var small_item_rect := Rect2(item_b_icon_rect.position, item_b_icon_rect.size * 0.52)\n\t_apply_control_rect(_item_b_glow, small_item_rect)\n\t_apply_control_rect(_item_b_icon, small_item_rect)\n\t_apply_control_rect(_item_status_countdown, Rect2(item_b_icon_rect.position + item_b_icon_rect.size * 0.43, item_b_icon_rect.size * 0.57))')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','func _sync_from_state() -> void:','func _create_tyche_display() -> void:\n\t_tyche_icon = TextureRect.new()\n\t_tyche_icon.texture = load("res://assets/objects/item_tyche_margarites.png")\n\t_tyche_icon.expand_mode = TextureRect.EXPAND_IGNORE_SIZE\n\t_tyche_icon.stretch_mode = TextureRect.STRETCH_KEEP_ASPECT_CENTERED\n\t_tyche_icon.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\tadd_child(_tyche_icon)\n\t_apply_control_rect(_tyche_icon, Rect2(onos_value_rect.position + Vector2(onos_value_rect.size.x - 4.0, -8.0), Vector2(28.0, 28.0)))\n\t_tyche_value = Label.new()\n\t_tyche_value.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\t_tyche_value.add_theme_font_size_override(&"font_size", 14)\n\t_tyche_value.add_theme_color_override(&"font_color", onos_font_color)\n\t_tyche_value.add_theme_color_override(&"font_outline_color", onos_outline_color)\n\t_tyche_value.add_theme_constant_override(&"outline_size", 3)\n\tadd_child(_tyche_value)\n\t_apply_control_rect(_tyche_value, Rect2(onos_value_rect.position + Vector2(onos_value_rect.size.x + 22.0, -2.0), Vector2(62.0, 25.0)))\n\t_sync_tyche_display()\n\nfunc _sync_tyche_display() -> void:\n\tif not is_instance_valid(_tyche_icon) or not is_instance_valid(_tyche_value): return\n\t_tyche_icon.visible = _game_state != null and _game_state.tyche_active\n\t_tyche_value.visible = _tyche_icon.visible\n\t_tyche_value.text = "+%d" % _game_state.tyche_stored_onos if _tyche_icon.visible else ""\n\nfunc _sync_from_state() -> void:')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','\t_sync_equipment_from_state()\n','\t_sync_equipment_from_state()\n\t_sync_tyche_display()\n',1)
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','func _on_inventory_changed(','func _on_tyche_changed(_active: bool, _stored_value: int) -> void:\n\t_sync_tyche_display()\n\nfunc _on_inventory_changed(')
          rep('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd','if _game_state.inventory_changed.is_connected(_on_inventory_changed):\n\t\t_game_state.inventory_changed.disconnect(_on_inventory_changed)','if _game_state.inventory_changed.is_connected(_on_inventory_changed):\n\t\t_game_state.inventory_changed.disconnect(_on_inventory_changed)\n\tif _game_state.tyche_changed.is_connected(_on_tyche_changed):\n\t\t_game_state.tyche_changed.disconnect(_on_tyche_changed)')

          p=Path('rebuild_v3/app/inventory/item_catalog.gd'); s=p.read_text()
          s=s.replace('"item_type":"passive","icon_path":"res://assets/objects/item_tyche_margarites.png"','"item_type":"active","icon_path":"res://assets/objects/item_tyche_margarites.png"')
          s=s.replace('"has_quantity":true,"activates_on_use":false,"sort_order":100,"behavior_id":"tyche_margarites"','"has_quantity":true,"activates_on_use":true,"sort_order":100,"behavior_id":"tyche_margarites"')
          p.write_text(s)

          p=Path('rebuild_v3/app/services/game_state.gd'); s=p.read_text()
          s=s.replace('signal onos_changed(current_value: int, delta: int)','signal onos_changed(current_value: int, delta: int)\nsignal tyche_changed(active: bool, stored_value: int)')
          s=s.replace('var onos: int = 0','var onos: int = 0\nvar tyche_active: bool = false\nvar tyche_stored_onos: int = 0')
          s=s.replace('\tonos = 0\n\tinventory.clear()','\tonos = 0\n\ttyche_active = false\n\ttyche_stored_onos = 0\n\tinventory.clear()')
          s=s.replace('func add_onos(amount: int) -> int:\n\tif amount == 0:\n\t\treturn 0\n\tvar previous_onos: int = onos','func add_onos(amount: int) -> int:\n\tif amount == 0: return 0\n\tif amount > 0 and tyche_active:\n\t\tvar multiplier := float(randi_range(10, 30)) / 10.0\n\t\ttyche_stored_onos += ceili(float(amount) * multiplier)\n\t\ttyche_changed.emit(true, tyche_stored_onos)\n\t\tstate_changed.emit()\n\t\treturn 0\n\tvar previous_onos: int = onos')
          methods='func activate_tyche_margarites() -> bool:\n\tif player_is_defeated or tyche_active: return false\n\ttyche_active = true\n\ttyche_stored_onos = 0\n\ttyche_changed.emit(true, 0)\n\tstate_changed.emit()\n\treturn true\n\nfunc clear_tyche_margarites() -> void:\n\tif not tyche_active and tyche_stored_onos == 0: return\n\ttyche_active = false\n\ttyche_stored_onos = 0\n\ttyche_changed.emit(false, 0)\n\tstate_changed.emit()\n\nfunc cash_in_tyche_margarites() -> int:\n\tif not tyche_active: return 0\n\tvar payout := tyche_stored_onos\n\ttyche_active = false\n\ttyche_stored_onos = 0\n\ttyche_changed.emit(false, 0)\n\tif payout > 0:\n\t\tvar previous_onos := onos\n\t\tonos += payout\n\t\tonos_changed.emit(onos, onos - previous_onos)\n\tstate_changed.emit()\n\treturn payout\n\n'
          s=s.replace('func set_onos(amount: int) -> void:',methods+'func set_onos(amount: int) -> void:')
          s=s.replace('\t\tplayer_is_defeated = true\n\t\tdefeat_state_changed.emit(true)','\t\tplayer_is_defeated = true\n\t\tclear_tyche_margarites()\n\t\tdefeat_state_changed.emit(true)')
          p.write_text(s)
          PY
          cat > rebuild_v3/shared/shaders/conus_rope_scroll.gdshader <<'SH'
          shader_type canvas_item;
          uniform float scroll_speed = 0.85;
          uniform vec4 glow_color : source_color = vec4(1.0, 0.25, 0.03, 1.0);
          void fragment() {
            vec2 uv = UV;
            uv.x = fract(uv.x + TIME * scroll_speed);
            vec4 tex = texture(TEXTURE, uv);
            vec3 tinted = mix(tex.rgb, glow_color.rgb, 0.32);
            COLOR = vec4(tinted, tex.a) * COLOR;
          }
          SH
          cat > rebuild_v3/app/contexts/gameplay/mati_overlay.gd <<'GD'
          class_name CotcMatiOverlay
          extends Control
          const MATI_TEXTURE: Texture2D = preload("res://assets/objects/ui_mati.png")
          var elapsed := 0.0
          func _ready() -> void:
          	mouse_filter = Control.MOUSE_FILTER_IGNORE
          	hide()
          func set_elapsed(value: float) -> void:
          	elapsed = clampf(value, 0.0, 30.0)
          	show(); queue_redraw()
          func clear() -> void:
          	hide(); queue_redraw()
          func _draw() -> void:
          	if not visible or MATI_TEXTURE == null: return
          	var ts := MATI_TEXTURE.get_size()
          	var horizontal := ts.x >= ts.y
          	var cell := Vector2(ts.y, ts.y) if horizontal else Vector2(ts.x, ts.x)
          	var count := maxi(1, roundi((ts.x if horizontal else ts.y) / (cell.x if horizontal else cell.y)))
          	var fps := 3.0 if elapsed < 5.0 or elapsed >= 25.0 else 1.0
          	var ff := elapsed * fps
          	var a := int(floor(ff)) % count
          	var b := (a + 1) % count
          	var blend := smoothstep(0.0, 1.0, ff - floor(ff))
          	var target := Rect2(Vector2(size.x - 178.0, 24.0), Vector2(150.0,150.0))
          	var sa := Rect2(Vector2(a*cell.x,0) if horizontal else Vector2(0,a*cell.y),cell)
          	var sb := Rect2(Vector2(b*cell.x,0) if horizontal else Vector2(0,b*cell.y),cell)
          	draw_texture_rect_region(MATI_TEXTURE,target,sa,Color(1,1,1,1.0-blend))
          	draw_texture_rect_region(MATI_TEXTURE,target,sb,Color(1,1,1,blend))
          GD
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rebuild_v3/app/contexts/gameplay/item_effect_controller.tscn'); s=p.read_text()
          s=s.replace('[gd_scene load_steps=9 format=3]','[gd_scene load_steps=10 format=3]')
          s=s.replace('[ext_resource type="AudioStream" path="res://assets/audio/invisibility.mp3" id="8_invisibility"]','[ext_resource type="AudioStream" path="res://assets/audio/invisibility.mp3" id="8_invisibility"]\n[ext_resource type="Script" path="res://rebuild_v3/app/contexts/gameplay/mati_overlay.gd" id="9_mati"]')
          s += '\n[node name="MatiCanvas" type="CanvasLayer" parent="."]\nlayer = 35\n[node name="MatiOverlay" type="Control" parent="MatiCanvas"]\nunique_name_in_owner = true\nprocess_mode = 3\nlayout_mode = 3\nanchors_preset = 15\nanchor_right = 1.0\nanchor_bottom = 1.0\ngrow_horizontal = 2\ngrow_vertical = 2\nscript = ExtResource("9_mati")\n'
          p.write_text(s)
          p=Path('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd'); s=p.read_text()
          s=s.replace('const ITEM_ARGONAUTA: StringName = &"argonauta"','const ITEM_ARGONAUTA: StringName = &"argonauta"\nconst BEHAVIOR_WORLD_FREEZE: StringName = &"world_freeze"\nconst BEHAVIOR_TYCHE: StringName = &"tyche_margarites"')
          s=s.replace('@onready var _invisibility_audio: AudioStreamPlayer = %InvisibilityAudio','@onready var _invisibility_audio: AudioStreamPlayer = %InvisibilityAudio\n@onready var _mati_overlay: CotcMatiOverlay = %MatiOverlay')
          s=s.replace('var _ink_cloud_status: Dictionary = {}','var _ink_cloud_status: Dictionary = {}\nvar _mati_active := false\nvar _mati_elapsed := 0.0\nvar _mati_phase := 0.0\nvar _hylas_previous_process_mode := Node.PROCESS_MODE_INHERIT')
          s=s.replace('func _process(delta: float) -> void:\n\tsuper._process(delta)','func _process(delta: float) -> void:\n\t_update_mati(delta)\n\tsuper._process(delta)')
          block='func handle_item_behavior(behavior_id: StringName, item_id: StringName, slot_id: StringName, origin: Vector2, direction: Vector2) -> bool:\n\tif behavior_id == BEHAVIOR_WORLD_FREEZE: return _activate_mati()\n\tif behavior_id == BEHAVIOR_TYCHE: return _connected_game_state != null and _connected_game_state.activate_tyche_margarites()\n\treturn super.handle_item_behavior(behavior_id,item_id,slot_id,origin,direction)\n\nfunc _activate_mati() -> bool:\n\tif _mati_active or not is_instance_valid(_hylas): return false\n\t_mati_active = true\n\t_mati_elapsed = 0.0\n\t_hylas_previous_process_mode = _hylas.process_mode\n\t_hylas.process_mode = Node.PROCESS_MODE_ALWAYS\n\t_mati_overlay.set_elapsed(0.0)\n\treturn true\n\nfunc _update_mati(delta: float) -> void:\n\tif not _mati_active: return\n\t_mati_elapsed = minf(30.0,_mati_elapsed+maxf(delta,0.0))\n\t_mati_overlay.set_elapsed(_mati_elapsed)\n\tvar ratio := 1.0\n\tif _mati_elapsed < 5.0: ratio = _mati_elapsed/5.0\n\telif _mati_elapsed >= 25.0: ratio = 1.0-((_mati_elapsed-25.0)/5.0)\n\t_mati_phase = fmod(_mati_phase + delta*12.0,1.0)\n\tget_tree().paused = ratio >= 0.999 or _mati_phase < ratio\n\tif _mati_elapsed >= 30.0: _finish_mati()\n\nfunc _finish_mati() -> void:\n\tget_tree().paused = false\n\tif is_instance_valid(_hylas): _hylas.process_mode = _hylas_previous_process_mode\n\t_mati_overlay.clear()\n\t_mati_active = false\n\t_mati_elapsed = 0.0\n\n'
          s=s.replace('func clear_active_effects() -> void:',block+'func clear_active_effects() -> void:')
          s=s.replace('\t_ink_cloud_status.clear()\n\tsuper.clear_active_effects()','\t_ink_cloud_status.clear()\n\tif _mati_active: _finish_mati()\n\tsuper.clear_active_effects()')
          s=s.replace('func _on_greatfin_changed(_is_active: bool) -> void:\n\t_play_greatfin_transition()','func _on_greatfin_changed(_is_active: bool) -> void:\n\tif not _active:\n\t\t_sync_greatfin_visual()\n\t\treturn\n\t_play_greatfin_transition()')
          p.write_text(s)
          PY
          git diff --check
      - name: Validate
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit-after 600 2>&1 | tee /tmp/editor.log
          godot --headless --path . --quit-after 20 2>&1 | tee /tmp/runtime.log
          ! grep -E 'Parse Error|Failed to load script|SCRIPT ERROR|Invalid call|Invalid set index|Cannot assign|Could not load|Node not found' /tmp/editor.log /tmp/runtime.log
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tmp_item_audit.txt .github/workflows/tmp-item-audit.yml .github/workflows/tmp-item-refinement.yml .github/workflows/tmp-item-refinement-v2.yml
          git add -A
          git commit -m 'Refine shell effects and timed utility items [item-refinement-done]'
          git push
