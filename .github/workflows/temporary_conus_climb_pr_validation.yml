name: Temporary Conus climb PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'work/conus-climb-2026-07-16'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/conus-climb-2026-07-16
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Apply direct production patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/temporary_conus_climb_validation.yml > /tmp/conus_driver.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/conus_driver.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_conus_climb.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply_conus_climb.py

      - name: Verify climb resources and direct methods
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/characters/hylas-climb01.webp \
            assets/characters/hylas-climb02.webp \
            assets/characters/hylas-climb03.webp \
            assets/characters/hylas-climb04.webp \
            assets/characters/hylas-greatfin-climb01.webp \
            assets/characters/hylas-greatfin-climb02.webp \
            assets/characters/hylas-greatfin-climb03.webp \
            assets/characters/hylas-greatfin-climb04.webp; do
              test -f "$file"
          done
          grep -q 'name": &"climb"' scenes/characters/Hylas/hylas_v3_sprite_frames.tres
          grep -q 'name":&"climb"' scenes/characters/Hylas/hylas_greatfin_sprite_frames.tres
          grep -q 'begin_conus_wall_climb' rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd
          grep -q 'func _update_conus_wall_climb' scenes/characters/Hylas/hylas_equipment_input.gd

      - name: Godot import validation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(script|resource)' /tmp/godot-import.log

      - name: Godot runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-runtime.log || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(script|resource)' /tmp/godot-runtime.log

      - name: Commit validated production changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/conus_climb_trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scenes/characters/Hylas/hylas_v3_sprite_frames.tres \
                  scenes/characters/Hylas/hylas_greatfin_sprite_frames.tres \
                  scenes/characters/Hylas/hylas_equipment_input.gd \
                  rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd
          git add -u .github/conus_climb_trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Conus wall tether climbing"
          git push origin HEAD:work/conus-climb-2026-07-16
