name: Validate Terebridae continuous stream

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'work/terebridae-continuous-stream-2026-07-17'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/terebridae-continuous-stream-2026-07-17
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Apply production change
        run: python3 .github/apply_terebridae_continuous_stream.py

      - name: Verify continuous-stream structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"stream_duration": 5.0' rebuild_v3/app/contexts/gameplay/item_effect_controller.gd
          ! grep -q '"duration": 5.0' rebuild_v3/app/contexts/gameplay/item_effect_controller.gd
          grep -q 'continuous_emission_duration' rebuild_v3/features/effects/conch_pulse_item_profiles.gd
          grep -q '_emit_continuous_pulses' rebuild_v3/features/effects/conch_pulse_screen_range.gd
          grep -q '_find_available_continuous_pulse' rebuild_v3/features/effects/conch_pulse_screen_range.gd
          grep -q '_continuous_next_emit_time += emission_interval' rebuild_v3/features/effects/conch_pulse_screen_range.gd

      - name: Import and parse project
        shell: bash
        run: |
          set +e
          timeout 600s godot --headless --editor --path . --quit-after 3 > /tmp/godot-import.log 2>&1
          code=$?
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource' /tmp/godot-import.log; then
            grep -n -E 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource' /tmp/godot-import.log | tail -n 80
            tail -n 120 /tmp/godot-import.log
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Godot import exited with code $code"
            tail -n 120 /tmp/godot-import.log
            exit "$code"
          fi

      - name: Run focused conch-pulse validation
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script .github/validate_terebridae_continuous_stream.gd 2>&1 | tee /tmp/terebridae-validation.log
          grep -F 'Terebridae continuous stream validation passed:' /tmp/terebridae-validation.log

      - name: Remove temporary validation files
        run: |
          rm .github/apply_terebridae_continuous_stream.py
          rm .github/validate_terebridae_continuous_stream.gd
          rm .github/workflows/validate_terebridae_continuous_stream.yml

      - name: Commit verified production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Terebridae emit a continuous drill stream'
          git push origin HEAD:work/terebridae-continuous-stream-2026-07-17
