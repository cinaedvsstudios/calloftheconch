name: Item correction error report
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/item-correction-pass-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply and capture errors
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          data = yaml.load(Path('.github/workflows/tmp-item-correction.yml').read_text(), Loader=yaml.BaseLoader)
          step = next(s for s in data['jobs']['correct']['steps'] if s.get('name') == 'Apply corrective pass')
          subprocess.run(['bash','-lc',step['run']], check=True)
          p=Path('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd')
          s=p.read_text().replace('node.process_mode = original_mode as Node.ProcessMode if allow_tick else Node.PROCESS_MODE_DISABLED','node.process_mode = original_mode if allow_tick else Node.PROCESS_MODE_DISABLED').replace('node.process_mode = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT)) as Node.ProcessMode','node.process_mode = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT))')
          p.write_text(s)
          PY
          godot --headless --editor --path . --quit-after 120 > /tmp/import.log 2>&1
          godot --headless --path . --quit-after 8 > /tmp/run.log 2>&1
          { grep -nE "SCRIPT ERROR|Parse Error|ERROR:|Failed loading resource|Cannot open file|Invalid" /tmp/import.log /tmp/run.log || true; } > /tmp/report.txt
          if [ ! -s /tmp/report.txt ]; then echo "No matched errors; full tail follows" > /tmp/report.txt; tail -n 120 /tmp/import.log >> /tmp/report.txt; tail -n 120 /tmp/run.log >> /tmp/report.txt; fi
          git reset --hard HEAD
          cp /tmp/report.txt tmp_item_correction_errors.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp_item_correction_errors.txt
          git commit -m "Record item correction validation errors"
          git push origin HEAD:work/item-correction-pass-2026-07-16
