name: Final item correction validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  final-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/item-correction-pass-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply final correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          data=yaml.load(Path('.github/workflows/tmp-item-correction.yml').read_text(),Loader=yaml.BaseLoader)
          step=next(s for s in data['jobs']['correct']['steps'] if s.get('name')=='Apply corrective pass')
          subprocess.run(['bash','-lc',step['run']],check=True)
          p=Path('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd')
          s=p.read_text().replace('node.process_mode = original_mode as Node.ProcessMode if allow_tick else Node.PROCESS_MODE_DISABLED','node.process_mode = original_mode if allow_tick else Node.PROCESS_MODE_DISABLED').replace('node.process_mode = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT)) as Node.ProcessMode','node.process_mode = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT))')
          p.write_text(s)
          p=Path('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd')
          s=p.read_text().replace('func _apply_control_rect(control: Control, target_rect: Rect2) -> void:\n\tcontrol.position = target_rect.position', 'func _apply_control_rect(control: Control, target_rect: Rect2) -> void:\n\tcontrol.anchor_left = 0.0\n\tcontrol.anchor_top = 0.0\n\tcontrol.anchor_right = 0.0\n\tcontrol.anchor_bottom = 0.0\n\tcontrol.position = target_rect.position')
          p.write_text(s)
          PY
      - name: Validate Godot errors
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit-after 120 > /tmp/import.log 2>&1
          godot --headless --path . --quit-after 8 > /tmp/run.log 2>&1
          cat /tmp/import.log
          cat /tmp/run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Invalid cast" /tmp/import.log /tmp/run.log; then exit 1; fi
          git diff --check
      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-item-correction.yml
          rm -f .github/workflows/tmp-item-correction-driver.yml
          rm -f .github/workflows/tmp-item-correction-error-report.yml
          rm -f .github/workflows/tmp-item-correction-final.yml
          rm -f tmp_item_correction_errors.txt
          rm -f rebuild_v3/app/contexts/gameplay/mati_overlay.gd rebuild_v3/app/contexts/gameplay/mati_overlay.gd.uid
          git add -A
          git diff --cached --check
          git commit -m "Correct HUD, held shells, timers, Mati and Conus visuals"
          git push origin HEAD:work/item-correction-pass-2026-07-16
