name: Item refinement validation driver
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/item-visual-timing-pass-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Execute refinement and validation blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          data = yaml.load(Path('.github/workflows/tmp-item-refinement-v2.yml').read_text(), Loader=yaml.BaseLoader)
          steps = data['jobs']['refine']['steps']
          wanted = {'Apply refinements', 'Validate'}
          for step in steps:
              if step.get('name') not in wanted:
                  continue
              script = step['run']
              print(f"--- {step['name']} ---")
              subprocess.run(['bash','-lc',script], check=True)
          PY
      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tmp_item_audit.txt tmp_trigger_item_refinement.txt
          rm -f .github/workflows/tmp-item-audit.yml
          rm -f .github/workflows/tmp-item-refinement.yml
          rm -f .github/workflows/tmp-item-refinement-v2.yml
          rm -f .github/workflows/tmp-item-refinement-driver.yml
          git add -A
          git diff --cached --check
          git commit -m 'Refine shell effects and timed utility items [item-refinement-done]'
          git push origin HEAD:work/item-visual-timing-pass-2026-07-16
