name: Validate Conus retraction and shadow fix

on:
  push:
    branches:
      - work/conus-retraction-shadow-fix-2026-07-17
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/conus-retraction-shadow-fix-2026-07-17

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Apply production fix
        run: python .github/apply_conus_retraction_shadow_fix.py

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          timeout 600s godot --headless --editor --path . --quit-after 3 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script/import error."
            exit 1
          fi

      - name: Run focused Conus runtime validation
        shell: bash
        run: |
          set -o pipefail
          timeout 180s godot --headless --path . --script .github/validate_conus_retraction_shadow_fix.gd 2>&1 | tee /tmp/conus-validation.log
          grep -F "Conus retraction and shadow alignment validation passed." /tmp/conus-validation.log

      - name: Remove temporary validation files
        run: |
          rm .github/apply_conus_retraction_shadow_fix.py
          rm .github/validate_conus_retraction_shadow_fix.gd
          rm .github/workflows/validate_conus_retraction_shadow_fix.yml

      - name: Commit verified production change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Conus climb retraction and shadow alignment"
          git push origin HEAD:work/conus-retraction-shadow-fix-2026-07-17
