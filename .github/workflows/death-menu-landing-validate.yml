name: Death menu landing validation

on:
  push:
    branches:
      - fix/death-menu-after-landing-2026-07-15
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit-after 600 2>&1 | tee godot-editor.log

      - name: Validate death signal order
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tools/validate_death_menu_landing.gd 2>&1 | tee godot-death-landing.log

      - name: Reject relevant Godot errors
        shell: bash
        run: |
          if grep -E "Parse Error|Failed to load script|SCRIPT ERROR|Invalid call|Invalid set index|Cannot assign|Could not load|DEATH_MENU_LANDING_VALIDATION_FAILED" godot-editor.log godot-death-landing.log; then
            echo "Godot reported a relevant project error."
            exit 1
          fi
          grep -q "DEATH_MENU_LANDING_VALIDATION_OK" godot-death-landing.log
          git diff --check

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: death-menu-landing-validation-logs
          path: |
            godot-editor.log
            godot-death-landing.log
          if-no-files-found: ignore
