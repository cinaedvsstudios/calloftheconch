name: Status timer and death validation

on:
  push:
    branches:
      - fix/status-timer-death-2026-07-15
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          timeout 180s godot --headless --editor --path . --quit 2>&1 | tee godot-import.log

      - name: Run main scene smoke test
        shell: bash
        run: |
          set +e
          timeout 15s godot --headless --path . > godot-main.log 2>&1
          code=$?
          cat godot-main.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Validate changed scenes and behavior
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/validate_status_timer_death.gd 2>&1 | tee godot-validation.log

      - name: Reject relevant Godot errors
        shell: bash
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot get class|Invalid call|Invalid access|STATUS_TIMER_DEATH_VALIDATION_FAILED" godot-import.log godot-main.log godot-validation.log; then
            exit 1
          fi

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-timer-death-validation-logs
          path: |
            godot-import.log
            godot-main.log
            godot-validation.log
