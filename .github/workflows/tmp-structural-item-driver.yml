name: Temporary structural item validation driver
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/structural-item-fixes-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply direct production fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # HUD panel: preserve source RGB and remove only near-black exterior pixels.
          path = 'rebuild_v3/app/contexts/gameplay/gameplay_hud.tscn'
          text = read(path)
          text = text.replace('[gd_scene format=3 uid="uid://k2serfn5csof"]', '[gd_scene load_steps=7 format=3 uid="uid://k2serfn5csof"]')
          if 'Shader_hud_black_alpha' not in text:
              marker = '[sub_resource type="SystemFont" id="LocationFont"]'
              resources = '''[sub_resource type="Shader" id="Shader_hud_black_alpha"]
          code = "shader_type canvas_item;\\nrender_mode unshaded, blend_mix;\\n\\nuniform float black_cutoff : hint_range(0.0, 0.2, 0.001) = 0.012;\\nuniform float black_feather : hint_range(0.001, 0.2, 0.001) = 0.018;\\n\\nvoid fragment() {\\n\\tvec4 source = texture(TEXTURE, UV) * COLOR;\\n\\tfloat light = max(source.r, max(source.g, source.b));\\n\\tfloat exterior_alpha = smoothstep(black_cutoff, black_cutoff + black_feather, light);\\n\\tCOLOR = vec4(source.rgb, source.a * exterior_alpha);\\n}"

          [sub_resource type="ShaderMaterial" id="ShaderMaterial_hud_black_alpha"]
          shader = SubResource("Shader_hud_black_alpha")
          shader_parameter/black_cutoff = 0.012
          shader_parameter/black_feather = 0.018

          '''
              text = text.replace(marker, resources + marker)
          panel_anchor = 'mouse_filter = 2\ntexture = ExtResource("2_lc38v")\nexpand_mode = 1\nstretch_mode = 5'
          if 'material = SubResource("ShaderMaterial_hud_black_alpha")' not in text:
              if panel_anchor not in text:
                  raise SystemExit('PanelTexture anchor missing')
              text = text.replace(panel_anchor, 'mouse_filter = 2\nmaterial = SubResource("ShaderMaterial_hud_black_alpha")\ntexture = ExtResource("2_lc38v")\nexpand_mode = 1\nstretch_mode = 5', 1)
          write(path, text)

          # HUD coordinates: Tyche uses explicit top-left coordinates.
          path = 'rebuild_v3/app/contexts/gameplay/gameplay_hud.gd'
          text = read(path)
          if 'tyche_icon_rect' not in text:
              text = text.replace('@export var location_value_rect: Rect2 = Rect2(76.0, 167.0, 361.0, 37.0)', '@export var location_value_rect: Rect2 = Rect2(76.0, 167.0, 361.0, 37.0)\n@export var tyche_icon_rect: Rect2 = Rect2(74.0, 78.0, 28.0, 28.0)\n@export var tyche_value_rect: Rect2 = Rect2(102.0, 78.0, 62.0, 25.0)')
          text = text.replace('_apply_control_rect(_tyche_icon, Rect2(onos_value_rect.position + Vector2(-34.0, -10.0), Vector2(28.0, 28.0)))', '_apply_control_rect(_tyche_icon, tyche_icon_rect)')
          text = text.replace('_apply_control_rect(_tyche_value, Rect2(onos_value_rect.position + Vector2(-5.0, -8.0), Vector2(62.0, 25.0)))', '_apply_control_rect(_tyche_value, tyche_value_rect)')
          write(path, text)

          # Live item controller: use the countdown owned by GameplayHud, loop timed audio,
          # and freeze direct gameplay roots while Hylas/UI/controller remain active.
          path = 'rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd'
          text = read(path)
          text = text.replace('_status_countdown = context.get_node_or_null("%ItemStatusCountdown") as CotcStatusCountdownOverlay', '_status_countdown = _gameplay_hud.get_node_or_null("ItemStatusCountdown") as CotcStatusCountdownOverlay if is_instance_valid(_gameplay_hud) else null')
          text = text.replace('var _mati_targets: Dictionary = {}\nvar _mati_tick_phase: float = 0.0', 'var _mati_targets: Dictionary = {}\nvar _mati_tick_phase: float = 0.0\nvar _mati_hylas_process_mode: int = Node.PROCESS_MODE_INHERIT\nvar _mati_water_material: ShaderMaterial\nvar _mati_visual_time: float = 0.0')

          if 'func _on_shield_audio_finished()' not in text:
              anchor = 'func configure(context: Node, level: CotcSeaOfPillars, hylas: CotcHylas) -> void:'
              ready = '''func _ready() -> void:
          \tsuper._ready()
          \tif not _shield_audio.finished.is_connected(_on_shield_audio_finished):
          \t\t_shield_audio.finished.connect(_on_shield_audio_finished)
          \tif not _invisibility_audio.finished.is_connected(_on_invisibility_audio_finished):
          \t\t_invisibility_audio.finished.connect(_on_invisibility_audio_finished)


          func _on_shield_audio_finished() -> void:
          \tif _purple_shield_remaining > 0.0:
          \t\t_shield_audio.play()


          func _on_invisibility_audio_finished() -> void:
          \tif _camouflage_remaining > 0.0:
          \t\t_invisibility_audio.play()


          '''
              text = text.replace(anchor, ready + anchor)

          capture_start = text.index('func _capture_mati_targets() -> void:')
          timed_anchor = text.index('func _set_item_b_timed_active(is_active: bool) -> void:')
          replacement = '''func _capture_mati_targets() -> void:
          \t_mati_targets.clear()
          \t_mati_tick_phase = 0.0
          \t_mati_visual_time = float(Time.get_ticks_msec()) / 1000.0
          \t_mati_water_material = null
          \tif is_instance_valid(_hylas):
          \t\t_mati_hylas_process_mode = _hylas.process_mode
          \t\t_hylas.process_mode = Node.PROCESS_MODE_ALWAYS
          \tif is_instance_valid(_context):
          \t\tfor child: Node in _context.get_children():
          \t\t\tif child == self or child.name == &"GameplayUI" or child.name == &"ItemEffectController":
          \t\t\t\tcontinue
          \t\t\t_mati_targets[child.get_instance_id()] = {
          \t\t\t\t"node": child,
          \t\t\t\t"process_mode": child.process_mode,
          \t\t\t}
          \t\tvar water_mottle: CanvasItem = _context.get_node_or_null(
          \t\t\t"SeaEnvironment/AtmosphereEffects/WaterMottle"
          \t\t) as CanvasItem
          \t\tif is_instance_valid(water_mottle) and water_mottle.material is ShaderMaterial:
          \t\t\t_mati_water_material = water_mottle.material as ShaderMaterial
          \t\t\t_mati_water_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)
          \t\t\t_mati_water_material.set_shader_parameter(&"mati_use_manual_time", true)


          func _apply_mati_world_activity(activity: float, delta: float) -> void:
          \t_mati_tick_phase = fmod(_mati_tick_phase + maxf(delta, 0.0) * 12.0, 1.0)
          \t_mati_visual_time += maxf(delta, 0.0) * activity
          \tif is_instance_valid(_mati_water_material):
          \t\t_mati_water_material.set_shader_parameter(&"mati_manual_time", _mati_visual_time)
          \tvar allow_tick: bool = activity >= 0.999 or _mati_tick_phase < activity
          \tfor entry_value: Variant in _mati_targets.values():
          \t\tif not (entry_value is Dictionary):
          \t\t\tcontinue
          \t\tvar entry: Dictionary = entry_value
          \t\tvar node: Node = entry.get("node") as Node
          \t\tif not is_instance_valid(node):
          \t\t\tcontinue
          \t\tvar original_mode: int = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT))
          \t\tnode.process_mode = original_mode if allow_tick else Node.PROCESS_MODE_DISABLED


          func _finish_mati() -> void:
          \tfor entry_value: Variant in _mati_targets.values():
          \t\tif not (entry_value is Dictionary):
          \t\t\tcontinue
          \t\tvar entry: Dictionary = entry_value
          \t\tvar node: Node = entry.get("node") as Node
          \t\tif is_instance_valid(node):
          \t\t\tnode.process_mode = int(entry.get("process_mode", Node.PROCESS_MODE_INHERIT))
          \t_mati_targets.clear()
          \tif is_instance_valid(_hylas):
          \t\t_hylas.process_mode = _mati_hylas_process_mode
          \tif is_instance_valid(_mati_water_material):
          \t\t_mati_water_material.set_shader_parameter(&"mati_use_manual_time", false)
          \t_mati_water_material = null
          \t_mati_active = false
          \t_mati_elapsed = 0.0
          \t_set_item_b_timed_active(false)
          \tif is_instance_valid(_status_countdown):
          \t\t_status_countdown.clear_countdown()


          '''
          text = text[:capture_start] + replacement + text[timed_anchor:]

          if 'func _stop_purple_shield() -> void:' not in text:
              anchor = 'func _on_ink_blob_impacted(impact_position: Vector2) -> void:'
              stop_code = '''func _stop_purple_shield() -> void:
          \t_shield_audio.stop()
          \tsuper._stop_purple_shield()


          func _stop_camouflage() -> void:
          \t_invisibility_audio.stop()
          \tsuper._stop_camouflage()


          '''
              text = text.replace(anchor, stop_code + anchor)
          text = text.replace('func clear_active_effects() -> void:\n\t_ink_cloud_status.clear()', 'func clear_active_effects() -> void:\n\t_shield_audio.stop()\n\t_invisibility_audio.stop()\n\t_ink_cloud_status.clear()')
          write(path, text)

          # Pulse colour: shader is the only RGB source.
          path = 'rebuild_v3/features/effects/conch_pulse_item_profiles.gd'
          text = read(path).replace('pulse_sprite.modulate = Color(_active_pulse_tint.r, _active_pulse_tint.g, _active_pulse_tint.b, 0.0)', 'pulse_sprite.modulate = Color(1.0, 1.0, 1.0, 0.0)')
          write(path, text)

          path = 'rebuild_v3/features/effects/conch_pulse_arc.gdshader'
          text = read(path).replace('vec4 source = texture(TEXTURE, UV) * COLOR;', 'vec4 source = texture(TEXTURE, UV);')
          text = text.replace('COLOR = vec4(tint_color.rgb * light * brightness, final_mask * tint_color.a);', 'COLOR = vec4(tint_color.rgb * light * brightness, final_mask * tint_color.a * COLOR.a);')
          write(path, text)

          # Water shader: controlled animation time during Mati.
          path = 'rebuild_v3/features/sea_of_pillars/water_noise.gdshader'
          text = read(path)
          if 'mati_use_manual_time' not in text:
              text = text.replace('uniform float depth_strength : hint_range(0.0, 1.0, 0.001) = 0.16;', 'uniform float depth_strength : hint_range(0.0, 1.0, 0.001) = 0.16;\nuniform bool mati_use_manual_time = false;\nuniform float mati_manual_time = 0.0;')
              text = text.replace('void fragment() {\n\tvec2 cloud_uv_a = UV * tile_count + flow_a * TIME;\n\tvec2 cloud_uv_b = UV * tile_count * 0.73 + vec2(0.317, 0.683) + flow_b * TIME;', 'void fragment() {\n\tfloat animation_time = mati_use_manual_time ? mati_manual_time : TIME;\n\tvec2 cloud_uv_a = UV * tile_count + flow_a * animation_time;\n\tvec2 cloud_uv_b = UV * tile_count * 0.73 + vec2(0.317, 0.683) + flow_b * animation_time;')
              text = text.replace('sin(TIME * evolution_speed)', 'sin(animation_time * evolution_speed)')
          write(path, text)

          # Conus: preserve accepted core and add one direct bloom Line2D.
          path = 'rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.tscn'
          text = read(path)
          if '[node name="RopeBloom"' not in text:
              bloom = '''[node name="RopeBloom" type="Line2D" parent="."]
          material = SubResource("GlowMaterial")
          width = 14.0
          default_color = Color(1, 0.18, 0.01, 0.08)
          texture = ExtResource("2_rope")
          texture_mode = 2
          texture_repeat = 2
          joint_mode = 2
          begin_cap_mode = 2
          end_cap_mode = 2
          antialiased = true

          '''
              text = text.replace('[node name="RopeGlow" type="Line2D" parent="."]', bloom + '[node name="RopeGlow" type="Line2D" parent="."]')
          write(path, text)

          path = 'rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd'
          text = read(path)
          if '_rope_bloom' not in text:
              text = text.replace('@onready var _rope_glow: Line2D = %RopeGlow', '@onready var _rope_bloom: Line2D = $RopeBloom\n@onready var _rope_glow: Line2D = %RopeGlow')
              text = text.replace('\t_rope.points = points\n\t_rope_glow.points = points', '\t_rope.points = points\n\t_rope_glow.points = points\n\t_rope_bloom.points = points')
              text = text.replace('\t_rope_glow.default_color = rope_glow_color', '\t_rope_glow.default_color = rope_glow_color\n\t_rope_bloom.default_color = Color(1.0, 0.18, 0.01, lerpf(0.05, 0.12, pulse))')
          write(path, text)

          # Assertions for every requested live path.
          checks = {
              'hud mask': 'ShaderMaterial_hud_black_alpha' in read('rebuild_v3/app/contexts/gameplay/gameplay_hud.tscn'),
              'hud countdown lookup': '_gameplay_hud.get_node_or_null("ItemStatusCountdown")' in read('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd'),
              'tyche top-left': 'tyche_icon_rect: Rect2 = Rect2(74.0, 78.0' in read('rebuild_v3/app/contexts/gameplay/gameplay_hud.gd'),
              'audio loop callback': 'func _on_shield_audio_finished()' in read('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd'),
              'mati roots': 'for child: Node in _context.get_children()' in read('rebuild_v3/app/contexts/gameplay/item_effect_controller_world_sync.gd'),
              'water freeze': 'mati_use_manual_time' in read('rebuild_v3/features/sea_of_pillars/water_noise.gdshader'),
              'pulse single tint': 'vec4 source = texture(TEXTURE, UV);' in read('rebuild_v3/features/effects/conch_pulse_arc.gdshader'),
              'conus bloom': '_rope_bloom.points = points' in read('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd'),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Failed direct assertions: ' + ', '.join(failed))
          PY
      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit-after 120 > /tmp/import.log 2>&1
          godot --headless --path . --quit-after 10 > /tmp/run.log 2>&1
          cat /tmp/import.log
          cat /tmp/run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Invalid cast|Invalid access" /tmp/import.log /tmp/run.log; then exit 1; fi
          git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-structural-item-fixes.yml
          rm -f tmp_structural_item_trigger.txt tmp_structural_patch_error.txt
          git add -A
          git diff --cached --check
          git commit -m "Fix live HUD timers, pulse colour, audio loops and Mati world freeze"
          git push origin HEAD:work/structural-item-fixes-2026-07-16
