name: Temporary structural item validation driver
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/structural-item-fixes-2026-07-16
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Apply branch patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          workflow = yaml.load(Path('.github/workflows/tmp-structural-item-fixes.yml').read_text(), Loader=yaml.BaseLoader)
          step = next(s for s in workflow['jobs']['apply-validate']['steps'] if s.get('name') == 'Apply direct production fixes')
          script = step['run']
          marker = "rope_controller = Path('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd').read_text()"
          if marker not in script:
              Path('/tmp/structural_patch_error.txt').write_text('Expected Conus safety marker missing from branch workflow\n')
          else:
              script = script.split(marker, 1)[0] + '''p = Path('rebuild_v3/game/shared/items/conus_textile/conus_tether_projectile.gd')
          rope_controller = p.read_text()
          rope_controller = rope_controller.replace('@onready var _rope_glow: Line2D = %RopeGlow', '@onready var _rope_bloom: Line2D = $RopeBloom\\n@onready var _rope_glow: Line2D = %RopeGlow')
          rope_controller = rope_controller.replace('\\t_rope.points = points\\n\\t_rope_glow.points = points', '\\t_rope.points = points\\n\\t_rope_glow.points = points\\n\\t_rope_bloom.points = points')
          rope_controller = rope_controller.replace('\\t_rope_glow.default_color = rope_glow_color', '\\t_rope_glow.default_color = rope_glow_color\\n\\t_rope_bloom.default_color = Color(1.0, 0.18, 0.01, lerpf(0.05, 0.12, pulse))')
          p.write_text(rope_controller)
          '''
              result = subprocess.run(['bash', '-lc', script], text=True, capture_output=True)
              if result.returncode != 0:
                  Path('/tmp/structural_patch_error.txt').write_text(
                      f'returncode={result.returncode}\n=== stdout ===\n{result.stdout}\n=== stderr ===\n{result.stderr}\n'
                  )
          PY
          if [ -f /tmp/structural_patch_error.txt ]; then
            cat /tmp/structural_patch_error.txt
            git reset --hard HEAD
            cp /tmp/structural_patch_error.txt tmp_structural_patch_error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tmp_structural_patch_error.txt
            git commit -m "Record structural item patch failure"
            git push origin HEAD:work/structural-item-fixes-2026-07-16
            exit 1
          fi
      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit-after 120 > /tmp/import.log 2>&1
          godot --headless --path . --quit-after 10 > /tmp/run.log 2>&1
          cat /tmp/import.log
          cat /tmp/run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Invalid cast|Invalid access" /tmp/import.log /tmp/run.log; then exit 1; fi
          git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-structural-item-fixes.yml
          rm -f tmp_structural_item_trigger.txt tmp_structural_patch_error.txt
          git add -A
          git diff --cached --check
          git commit -m "Fix live HUD timers, pulse colour, audio loops and Mati world freeze"
          git push origin HEAD:work/structural-item-fixes-2026-07-16
